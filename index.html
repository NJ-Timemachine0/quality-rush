<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>パーツポン！工場</title>
<!-- v0.9.6 C1：CrazyGames SDK v3（ゲームのコードより前）。読めない・disabled のときはSDKなしで動く -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<link rel="icon" type="image/png" href="assets/ui/favicon.png">
<style>
  /* v0.9.7 A4：フォント MPR1c（M PLUS Rounded 1c ExtraBold のサブセット・OFL）。絵文字と ⚠ は入っていないので（v1.00-rc：↻⌛ は文字に置きかえた）、うしろのフォントで出す */
  @font-face{font-family:'MPR1c';src:url('assets/font/mplusr1c_xb_subset.woff2') format('woff2');font-weight:800;font-display:swap}
  /* v0.9.7 C3：明るい配色（あーと palette_v100.json） */
  :root{--ink:#2B2F4A;--plate:rgba(255,255,255,.92);--plateShadow:#D9C9F0;--accent:#FFC93C;--accentEdge:#E0A100;--sky:#92C4FF;--pink:#FF8FB8;--lav:#D9C9F0;--track:#EEE6F5;--warnText:#C62828;
    --font:'MPR1c','Hiragino Maru Gothic ProN','Arial Rounded MT Bold',system-ui,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
  html{height:100%;background:linear-gradient(#BFD8FF,#FFE3F1)}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:var(--font);font-weight:800;color:var(--ink);-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  /* A1：背景。スマホ縦は bg_portrait、PC横は bg_pc（どちらも cover・中央）。黒い帯は出さない */
  body{background:url('assets/bg/bg_portrait_800x1520.webp') center/cover no-repeat,linear-gradient(#BFD8FF,#FFE3F1)}
  body.pc{background:url('assets/bg/bg_pc_1920x1080.webp') center/cover no-repeat,linear-gradient(#BFD8FF,#FFE3F1)}
  #wrap{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);padding:var(--safe-area-inset-top,env(safe-area-inset-top)) var(--safe-area-inset-right,env(safe-area-inset-right)) var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) var(--safe-area-inset-left,env(safe-area-inset-left))}
  #col{display:flex;line-height:0}
  /* C4：PC横のまんなかの列は frame_pc_column の 9-slice（角48px）。絵の中は透明 */
  body.pc #col{border:16px solid transparent;border-image:url('assets/ui/frame_pc_column.webp') 48 fill / 16px stretch}
  canvas{background:transparent;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#FFF7EA;text-align:center;padding:0 14px;overflow-y:auto;color:var(--ink)}
  .ov{justify-content:safe center}   /* v0.9.6：横長で中身が高さを超えても上が切れない（スクロールできる） */
  .ov.hidden{display:none}
  /* v0.9.8 C2：読み込み画面（明るい背景＋ロゴ＋進み具合のバー）。読み込みが終わったら自動で始まる（タイトル画面は出さない） */
  #loadBox{display:none;width:min(280px,70vw);margin:14px auto 0}
  #loadBar{height:16px;border-radius:8px;background:var(--track);border:2px solid var(--lav);overflow:hidden}
  #loadFill{height:100%;width:0;background:var(--accent);transition:width .15s}
  #loadPct{font-size:16px;margin-top:6px}
  .ov.loading > *{display:none!important}
  .ov.loading > h1, .ov.loading > #loadBox{display:block!important}
  #pauseBest{font-size:16px;margin:2px 0 4px}
  /* ボタン：主（黄）と副（白）は あーとの 9-slice（角44px・下に6pxの厚み）。押すと沈む */
  button{font-family:var(--font);font-weight:800;font-size:20px;padding:4px 18px;margin:8px;min-height:44px;color:var(--ink);background:transparent;border-style:solid;border-width:18px;border-color:transparent;border-image:url('assets/ui/btn_primary_9s.webp') 44 fill / 18px stretch;border-radius:0;line-height:1.2}
  button:active{transform:translateY(3px)}
  button.sec,#howBtn,#introReplayBtn,#howBtn2,#muteBtn2,#howNo,#shareBtn,#retryNoBtn,#langRow button{border-image-source:url('assets/ui/btn_secondary_9s.webp')}
  #langRow{margin-top:10px}
  #langRow button{font-size:15px;padding:0 10px;border-width:14px;border-image-width:14px;opacity:.75}
  #langRow button.on{opacity:1;border-image-source:url('assets/ui/btn_primary_9s.webp')}
  h1{margin:0 0 6px;color:var(--ink);text-shadow:0 2px 0 #fff,0 0 8px rgba(255,255,255,.9)}
  #ovText{margin:6px 0;font-size:15px;line-height:1.5}
  #startBtn{font-size:26px;padding:4px 36px;border-width:22px;border-image-width:22px}
  #howBtn,#introReplayBtn,#howBtn2,#muteBtn2,#howNo,#shareBtn{font-size:16px;padding:0 14px;border-width:16px;border-image-width:16px}
  #howBtn.hidden{display:none}
  #howBtn:disabled{opacity:.5}
  #startBtn:disabled{opacity:.6;filter:grayscale(.6)}
  #shareBtn.hidden{display:none}
  #howConfirm.hidden{display:none!important}
  #retryOv.hidden{display:none!important}
  #retryOv button.hidden{display:none!important}
  #retryOv button{min-width:min(280px,86vw);font-size:16px;padding:0 14px;border-width:16px;border-image-width:16px}
  #retryCount{font-size:28px;font-weight:800;color:var(--ink);margin:4px 0 8px}
  #retrySub{font-size:14px;line-height:1.45;color:var(--ink);margin:0 0 10px;max-width:320px}
  #retryMsg{font-size:15px;color:var(--ink);min-height:20px;margin:6px 0}
  .flowBig.wd{width:min(450px,96vw);}
  .flowBig{display:block;width:min(400px,96vw);margin:6px auto;border-radius:10px}
  .flowBig.fb{display:none}
  .res{font-size:17px;line-height:1.55}
  .title{font-size:22px;color:var(--ink);font-weight:800}
  .newRec{display:inline-block;color:var(--ink);background:var(--accent);border-radius:10px;padding:0 10px;font-size:26px;font-weight:800;animation:glow .6s ease-in-out infinite alternate}
  @keyframes glow{from{box-shadow:0 0 4px var(--accent);transform:scale(1)}to{box-shadow:0 0 18px #fff3a0;transform:scale(1.06)}}
  .goal{margin-top:8px;font-size:15px;color:var(--ink)}
  .goal img{display:block;margin:6px auto 0;width:160px;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
  .goal img.fb{filter:brightness(0) drop-shadow(0 0 6px rgba(255,255,255,.6))}
  #copied{font-size:14px;color:var(--ink);min-height:18px}
  b.neg{color:var(--warnText)}
  /* C3：結果は明るいカード（ランク・総合点を一番上に大きく） */
  .rCard{background:var(--plate);border-radius:14px;box-shadow:0 3px 0 var(--plateShadow);padding:10px 16px;margin:4px auto;max-width:360px;line-height:1.5}
  .rHead{font-size:20px}
  .rTop{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0}
  .rRank{width:64px;height:64px;line-height:64px;border-radius:50%;background:var(--accent);box-shadow:inset 0 -5px 0 var(--accentEdge);font-size:38px;color:var(--ink)}
  .rScore{font-size:34px}
  .rScore small{font-size:16px}
  .rStats{font-size:15px;text-align:left;display:inline-block}
  .rRanks{font-size:14px;text-align:left}
  .rRetry{font-size:14px;color:var(--ink);background:var(--track);border-radius:6px;padding:0 4px}
  @media (min-aspect-ratio: 6/5){ .flowBig{width:auto;max-width:min(400px,96vw);max-height:32vh} h1{font-size:24px} #startBtn{font-size:24px} #ovText{font-size:15px;margin:4px 0} .ov button{margin:5px} #langRow{margin-top:4px} }
  /* C4：PC横の左右の板（白い板・あーとのアイコン48px・文字16px以上） */
  .pcPanel{box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:14px;margin:0 12px;background:var(--plate);border-radius:14px;box-shadow:0 3px 0 var(--plateShadow);font-size:16px;line-height:1.35;color:var(--ink);max-height:96vh;overflow:hidden}
  .pcPanel.hidden{display:none}
  .pcPanel .ico{width:48px;height:48px;flex:none}
  .pcPanel .lbl{font-size:16px;color:var(--ink);opacity:.85}
  .pcPanel .val{font-size:24px;font-weight:800}
  .pcPanel .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pcPanel .row.nw{flex-wrap:nowrap}
  #pNextCv{width:72px;height:72px}
  #pCarImg{height:30px}
  #pPips span{display:inline-block;width:20px;height:12px;margin-right:4px;background:var(--track);border:1px solid var(--lav);border-radius:3px}
  #pPips span.on{background:var(--accent);border-color:var(--accentEdge)}
  #pGauge{height:14px;background:var(--track);border-radius:7px;overflow:hidden;margin-top:4px}
  #pGaugeBar{height:100%;width:100%;background:var(--accent)}
  .pcPanel button.pbtn{width:56px;height:56px;min-width:56px;min-height:56px;padding:0;margin:0;border:0;border-image:none;background:transparent;line-height:0}
  .pcPanel button.pbtn img{width:48px;height:48px}
  #pKeys{font-size:16px;color:var(--ink);line-height:1.6}
  #pKeys b{display:inline-block;min-width:22px;padding:0 5px;margin-right:2px;border-radius:6px;background:var(--track);border:1px solid var(--lav);color:var(--ink);font-size:16px;text-align:center}
  @media (min-height: 860px) and (min-aspect-ratio: 6/5){ .pcPanel{font-size:20px;gap:16px;padding:18px} .pcPanel .lbl{font-size:20px} .pcPanel .val{font-size:32px} .pcPanel .ico{width:64px;height:64px} #pKeys,#pKeys b{font-size:19px} #pNextCv{width:96px;height:96px} #pCarImg{height:40px} }
  @media (max-height: 560px){ .pcPanel{gap:8px;padding:10px} .pcPanel .val{font-size:20px} #pKeys{line-height:1.45} }
  /* v0.9.8 監査1：3ステップの絵（落とす → くっつける → 出荷） */
  .steps3{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px auto;padding:8px 10px;background:#fff;border:2px solid var(--lav);border-radius:14px;max-width:min(420px,96vw);box-sizing:border-box}
  .steps3 .st{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;flex:1 1 0}
  .steps3 .stT{font-size:16px;line-height:1.2;color:var(--ink);white-space:nowrap}
  .steps3 .stA{font-size:22px;font-weight:800;color:var(--ink);opacity:.7;flex:none}
  .steps3 .stHand{width:56px;height:56px;background:url(assets/ui/hand_drag.webp) 0 0/200% 100% no-repeat}
  .steps3 .stPair{display:flex;height:56px;align-items:center}.steps3 .stPair img{width:34px;height:34px}.steps3 .stPair img+img{width:42px;height:42px;margin-left:-6px}
  .steps3 .stCar{height:56px;width:auto;max-width:100%}
  @media (max-height: 560px){ .steps3{margin:4px auto;padding:4px 8px} .steps3 .stHand,.steps3 .stPair,.steps3 .stCar{height:44px} .steps3 .stHand{width:44px} }
  .steps3[hidden]{display:none}
  img.howto3{display:block;width:min(480px,92vw);height:auto;margin:6px auto}
  @media (max-height: 560px){ img.howto3{width:min(330px,92vw);margin:2px auto} }
  #howConfirm{overflow-y:auto;justify-content:safe center!important}
  /* v0.9.9 C6：設定画面 */
  #setOv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:8px;background:#FFF7EA;padding:14px;text-align:center;overflow-y:auto}
  #setOv.hidden{display:none!important}
  #setOv h2{margin:0 0 4px;font-size:22px;color:var(--ink)}
  #setOv button.tg{min-width:230px;font-size:17px;border-image-source:url('assets/ui/btn_secondary_9s.webp');padding:0 14px;border-width:16px;border-image-width:16px}
  #setOv button.tg.off{opacity:.8}
  #setOv button.tg b{color:#2F7D4F}#setOv button.tg.off b{color:#8A6A00}
  #credits{font-size:14px;line-height:1.55;color:var(--ink);background:#fff;border:2px solid var(--lav);border-radius:12px;padding:8px 14px;max-width:min(360px,92vw)}
  #setBack,#setBtn{font-size:16px;padding:0 14px;border-width:16px;border-image-width:16px;border-image-source:url('assets/ui/btn_secondary_9s.webp')}
  @media (max-height: 560px){ #setOv{gap:4px;padding:6px} #setOv h2{font-size:18px} #credits{font-size:14px;line-height:1.35;padding:4px 10px} }
  #howImg.h{width:min(480px,92vw);height:auto}
  #howImg.v{width:min(72vw,340px);height:auto}
  /* v0.9.8 監査2：横長の左の板に道すじ */
  #pPath .prow{display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:nowrap}
  #pPath .pn{font-size:14px;min-width:4.2em;color:var(--ink);font-weight:800}
  #pPath img{width:28px;height:28px;border-radius:50%;filter:grayscale(1) brightness(.85);opacity:.6}
  #pPath img.made{filter:none;opacity:1}
  #pPath img.cur,#pPath .pj.cur{outline:3px solid #FFD84A;outline-offset:1px}
  #pPath .pj{font-size:14px;font-weight:800;padding:2px 8px;border-radius:12px;background:#D5D8E4;color:var(--ink)}
  #pPath .pj.made{background:var(--accent)}
  #pPath .pcar{width:44px;height:auto;border-radius:0}
  #pCarImg{height:44px}
  /* v1.00-rc C7：車図鑑・バッジ */
  #catOv{z-index:30;justify-content:flex-start;padding:12px 10px 18px}
  #catOv h1{font-size:24px;margin:4px 0 2px}
  #catOv h2{font-size:18px;margin:10px 0 4px;color:var(--ink)}
  #catSum,#badgeNext{font-size:15px;font-weight:800;color:var(--ink)}
  #catGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(100%,360px);margin:6px auto}
  body.pc #catGrid{grid-template-columns:repeat(4,minmax(0,1fr));width:min(96vw,920px)}
  .cc{position:relative;aspect-ratio:320/220;background:url(assets/ui/catalog_card.webp) 0 0/100% 100% no-repeat}
  .cc img{position:absolute;left:5.6%;top:8.2%;width:88.8%;height:55.5%;object-fit:contain;object-position:50% 100%}
  .cc .cn{position:absolute;left:7.5%;right:7.5%;top:70.5%;height:18.6%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden}
  .cc .cs{position:absolute;left:7%;top:10%;background:rgba(255,255,255,.92);border-radius:10px;padding:0 6px;font-size:14px;font-weight:800;color:#E0A100;line-height:1.35}
  .cc .cs small{color:var(--ink);font-size:14px;margin-left:4px}
  .cc.locked .cn{opacity:.8}
  #badgeGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 4px;width:min(100%,360px);margin:4px auto}
  body.pc #badgeGrid{grid-template-columns:repeat(6,minmax(0,1fr));width:min(96vw,720px)}
  .bd{display:flex;flex-direction:column;align-items:center;font-size:14px;line-height:1.2;color:var(--ink)}
  .bd img{width:56px;height:56px}
  .bd.off img{filter:grayscale(1) opacity(.45)}
  .bd.off{opacity:.75}
  #badgeBar{height:12px;width:min(300px,80vw);background:var(--track);border-radius:6px;overflow:hidden;margin:4px auto}
  #badgeBarFill{height:100%;background:var(--accent)}
  .rProg{font-size:15px}
  .rProg img{width:56px;height:56px;vertical-align:middle;margin:2px}
  #catBack,#catBtn,#catBtn2{font-size:16px;padding:0 14px;border-width:16px;border-image-width:16px;border-image-source:url('assets/ui/btn_secondary_9s.webp')}
</style>
</head>
<body>
<div id="wrap">
  <div id="pcL" class="pcPanel hidden">
    <div class="row nw"><img class="ico" src="assets/ui/icon_sales.webp" alt=""><div><div class="lbl" id="pSalesL"></div><div class="val" id="pSales"></div></div></div>
    <div class="row nw"><img class="ico" src="assets/ui/icon_car.webp" alt=""><div><div class="lbl" id="pCarsL"></div><div class="val" id="pCars"></div></div><div style="margin-left:10px"><div class="lbl">Lv</div><div class="val" id="pLv"></div></div></div>
    <div><div class="lbl" id="pCarL"></div><div class="row"><img id="pCarImg" alt=""><span id="pToNext"></span></div><div id="pPips" style="margin-top:6px"></div></div>
    <div id="pPath"></div>
  </div>
  <div id="col"><canvas id="c"></canvas></div>
  <div id="pcR" class="pcPanel hidden">
    <div class="row nw"><img class="ico" src="assets/ui/icon_next.webp" alt=""><div class="lbl" id="pNextL"></div><canvas id="pNextCv" width="144" height="144"></canvas></div>
    <div><div class="row nw"><img class="ico" src="assets/ui/icon_timer.webp" alt=""><div><div class="lbl" id="pDropL"></div><div class="val" id="pDrop"></div></div></div><div id="pGauge"><div id="pGaugeBar"></div></div></div>
    <div class="row"><button class="pbtn" id="pPause" aria-label="pause"><img src="assets/ui/icon_pause.webp" alt=""></button><button class="pbtn" id="pMute" aria-label="sound"><img id="pMuteImg" src="assets/ui/icon_sound_on.webp" alt=""></button></div>
    <div id="pKeys"></div>
  </div>
  <div id="overlay" class="ov">
    <h1 id="gameTitle">パーツポン！工場</h1>
    <div id="loadBox"><div id="loadBar"><div id="loadFill"></div></div><div id="loadPct">0%</div></div>
    <img id="flowTitle" class="howto3" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="steps3" hidden role="img"><div class="st"><div class="stHand"></div><b class="stT" data-k="step_drop"></b></div><span class="stA">→</span><div class="st"><div class="stPair"><img src="assets/parts_v3/badge_wheel.webp" alt=""><img src="assets/parts_v3/badge_tire.webp" alt=""></div><b class="stT" data-k="step_match"></b></div><span class="stA">→</span><div class="st"><img class="stCar" src="assets/cars/car_lv1_kei.webp" alt=""><b class="stT" data-k="step_ship"></b></div></div>
    <div id="ovText"></div>
    <button id="startBtn" disabled>読み込み中…</button>
    <button id="howBtn" disabled>遊び方</button>
    <script>(function(){ var q = new URLSearchParams(location.search).get('lang'); var l = (q==='ja'||q==='en') ? q : ((navigator.language||'').slice(0,2)==='ja' ? 'ja' : 'en'); if (l==='en'){ document.getElementById('startBtn').textContent='Loading…'; document.getElementById('howBtn').textContent='How to play'; } })();</script>
    <button id="catBtn2" class="hidden"></button>
    <button id="shareBtn" class="hidden"></button>
    <div id="copied"></div>
    <div id="langRow"><button id="langJa">日本語</button><button id="langEn">English</button></div>
  </div>
  <div id="pauseOv" class="ov hidden">
    <h1 id="pauseTitle"></h1>
    <img class="howto3" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="steps3" hidden role="img"><div class="st"><div class="stHand"></div><b class="stT" data-k="step_drop"></b></div><span class="stA">→</span><div class="st"><div class="stPair"><img src="assets/parts_v3/badge_wheel.webp" alt=""><img src="assets/parts_v3/badge_tire.webp" alt=""></div><b class="stT" data-k="step_match"></b></div><span class="stA">→</span><div class="st"><img class="stCar" src="assets/cars/car_lv1_kei.webp" alt=""><b class="stT" data-k="step_ship"></b></div></div>
    <button id="resumeBtn"></button>
    <button id="introReplayBtn"></button>
    <button id="howBtn2"></button>
    <button id="catBtn"></button>
    <button id="setBtn"></button>
    <div id="pauseBest"></div>
    <div id="setOv" class="hidden">
      <h2 id="setTitle"></h2>
      <button id="muteBtn2" class="tg"></button>
      <button id="bgmBtn" class="tg"></button>
      <button id="motionBtn" class="tg"></button>
      <div id="langRow2" style="margin-top:4px"><button id="langJa2" class="sec" style="font-size:15px;padding:0 10px;border-width:14px;border-image-width:14px">日本語</button><button id="langEn2" class="sec" style="font-size:15px;padding:0 10px;border-width:14px;border-image-width:14px">English</button></div>
      <div id="credits"><b id="credL"></b><br>Music: "Happy Vibes" by Ruskerdax (CC0)<br>Font: M PLUS Rounded 1c (SIL OFL 1.1)<br>Physics: Matter.js (MIT)<br>Game: Timemachine0</div>
      <button id="setBack"></button>
    </div>
    <div id="howConfirm" class="hidden" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#FFF7EA;padding:24px;text-align:center">
      <img id="howImg" alt="">
      <p id="howConfirmText" style="color:#2B2F4A;font-weight:800;font-size:17px;line-height:1.5;margin:0 0 6px"></p>
      <button id="howYes"></button>
      <button id="howNo"></button>
    </div>

function fmtYen(v){
  if (v < 0) return '−' + fmtYen(-v);   // マイナスは先頭に「−」
  if (lang!=='ja') return `$${Math.round(v*(CONFIG.usdPerYen||0.01)).toLocaleString('en-US')}`;   // v0.9.8 監査4：英語は $（表示だけ ¥100＝$1。点数・保存は円のまま）
  if (v >= 100000000){
    const oku = Math.floor(v/100000000), man = (v - oku*100000000)/10000;
    return man > 0 ? `${oku}億${man.toLocaleString()}万円` : `${oku}億円`;
  }
  return v>=10000 ? `${(v/10000).toLocaleString()}万円` : `${v.toLocaleString()}円`;
}

  const s = cgSdk(); if (!s) return;
  try{ const m = s[mod]; if (m && typeof m[fn] === 'function'){ SDKS.calls.push(fn); const r = m[fn](...args); if (r && typeof r.catch === 'function') r.catch(()=>{}); return r; } }catch(e){}
}
function sdkReadSettings(st){ try{ const g = st || (cgSdk() && cgSdk().game.settings); SDKS.muteAudio = !!(g && g.muteAudio); }catch(e){ SDKS.muteAudio = false; } }
async function sdkInit(){
  let raw = null; try{ raw = window.CrazyGames && window.CrazyGames.SDK; }catch(e){}
  if (!raw || typeof raw.init !== 'function'){ SDKS.env = 'none'; return false; }   // スクリプトが読めなかった（広告ブロック・オフライン・file://）
  try{
    let to; await Promise.race([ Promise.resolve().then(()=>raw.init()), new Promise((_, rej) => { to = setTimeout(()=>rej(new Error('sdk init timeout')), CONFIG.sdkInitTimeoutMs); }) ]); clearTimeout(to);
  }catch(e){ SDKS.env = 'error'; return false; }

  try{ const d = raw.data; if (d && typeof d.getItem === 'function' && typeof d.setItem === 'function'){ d.getItem('qr_migrated_v1'); SDKS.dataOk = true; } }catch(e){ SDKS.dataOk = false; }

const Store = {
  backend(){ if (SDKS.dataOk){ try{ const d = window.CrazyGames.SDK.data; if (d && d.getItem) return d; }catch(e){} } try{ return window.localStorage; }catch(e){ return null; } },
  get(k, def){ try{ const b=this.backend(); const v=b && b.getItem('qr_'+k); return v==null ? def : JSON.parse(v); }catch(e){ return def; } },
  set(k, v){ if (QA_MODE) return; try{ const b=this.backend(); b && b.setItem('qr_'+k, JSON.stringify(v)); }catch(e){} },
  remove(k){ if (QA_MODE) return; try{ const b=this.backend(); b && b.removeItem && b.removeItem('qr_'+k); }catch(e){} }
};
// 初回だけ：localStorage の qr_ キーを SDK.data に写す（SDK 側にすでにある値は上書きしない）。qr_migrated_v1=true を付けて1回だけ
function sdkMigrate(){
  if (!SDKS.dataOk || QA_MODE) return 0;
  let n = 0;
  try{
    const d = window.CrazyGames.SDK.data, ls = window.localStorage;
    if (d.getItem('qr_migrated_v1') != null) return 0;
    const keys = []; for (let i = 0; i < ls.length; i++){ const k = ls.key(i); if (k && k.indexOf('qr_') === 0 && k !== 'qr_migrated_v1') keys.push(k); }
    for (const k of keys){ if (d.getItem(k) == null){ const v = ls.getItem(k); if (v != null){ d.setItem(k, v); n++; } } }
    d.setItem('qr_migrated_v1', 'true'); SDKS.migrated = true;
  }catch(e){}
  return n;
}

const prefersReducedMotion = () => { try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){ return false; } };
const Settings = {
  get bgm(){ return Store.get('bgm', true) !== false; },

  get lang(){ const v = Store.get('lang', null); return (v === 'ja' || v === 'en') ? v : null; },
  set(k, v){ if (k === 'bgm') Store.set('bgm', !!v); else if (k === 'reduceMotion') Store.set('reduceMotion', !!v); else if (k === 'lang' && (v === 'ja' || v === 'en')) Store.set('lang', v); }
};

}

  setTxt(PANEL.pCarL, T.carL);
  if (CONFIG.pcPathInPanel && CONFIG.pathShow){   // v0.9.8 監査2：道すじ（ボディ／シャシー → 合体 → 完成）
    const made = state.pathMade || {}, cur = new Set(pathCurrentIds());
    const ic = id => { const a = id === 'car' ? (CAR_RANKS[rk] && CAR_RANKS[rk].img) : ART.root[id], src = a && a.ok ? a.src : ''; return src ? `<img data-id="${id}" class="${made[id]?'made':''}${cur.has(id)?' cur':''}${id==='car'?' pcar':''}" src="${src}" alt="">` : ''; };
    const html = `<div class="lbl">${T.pathL}</div>`
      + `<div class="prow"><span class="pn">${lang==='ja'?'ボディ':'Body'}</span>${PATH_LEFT.map(ic).join('')}</div>`
      + `<div class="prow"><span class="pn">${lang==='ja'?'シャシー':'Chassis'}</span>${PATH_RIGHT.map(ic).join('')}</div>`
      + `<div class="prow"><span class="pn">→</span><span class="pj${made.marriage?' made':''}${cur.has('marriage')?' cur':''}" data-id="marriage">${lang==='ja'?'合体':'Join'}</span>${ic('car')}</div>`;
    if (PANEL.pPath.innerHTML !== html) PANEL.pPath.innerHTML = html;
  }
  // 「次」の部品：小さいキャンバスに drawPart で描く（ctx を一時的に差し替え）
  const nc = PANEL.pNextCv, nctx = nc.getContext('2d');
  nctx.setTransform(1,0,0,1,0,0); nctx.clearRect(0,0,nc.width,nc.height);
  if (state.next){
    const nr = R(state.next.k), sc = (nc.width*0.42)/nr;
    const saved = ctx; ctx = nctx;
    try{ nctx.setTransform(sc,0,0,sc,nc.width/2,nc.height/2); drawPart(state.next.k, state.next.bad, 0, 0, 0, now); }catch(e){} finally{ ctx = saved; }
  }
}
PANEL.pPause.onclick = () => { if (state.running && !state.paused) pauseGame(); };
PANEL.pMute.onclick = () => { toggleAllSound(); blurActive(); };
resize();

</script>
