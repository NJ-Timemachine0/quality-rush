<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quality Rush Ver0.3</title>
<style>
  html,body{margin:0;height:100%;background:#1b2330;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center}
  canvas{background:#2c3a4f;border-radius:8px;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.74);text-align:center;padding:0 14px;overflow-y:auto}
  .ov.hidden{display:none}
  button{font-size:20px;padding:12px 28px;margin:8px;border:none;border-radius:10px;background:#f5b700;color:#222;font-weight:bold}
  #langRow{margin-top:10px}
  #langRow button{font-size:15px;padding:8px 16px;background:#445;color:#fff}
  #langRow button.on{background:#fff;color:#222}
  h1{margin:0 0 6px}
  #ovText{margin:6px 0;font-size:15px;line-height:1.5}
  #startBtn{font-size:26px;padding:14px 44px}
  #startBtn:disabled{background:#8a7a40;color:#444;opacity:.8}
  #shareBtn{font-size:16px;padding:9px 20px;background:#2f7fe0;color:#fff}
  #shareBtn.hidden{display:none}
  .flowBig{display:block;width:min(340px,92vw);margin:6px auto;border-radius:10px}
  .flowBig.fb{display:none}
  .res{font-size:17px;line-height:1.55}
  .title{font-size:22px;color:#ffd84a;font-weight:bold}
  .newRec{display:inline-block;color:#ffd84a;font-size:28px;font-weight:bold;animation:glow .6s ease-in-out infinite alternate}
  @keyframes glow{from{text-shadow:0 0 4px #ffd84a;transform:scale(1)}to{text-shadow:0 0 18px #fff3a0;transform:scale(1.08)}}
  .goal{margin-top:8px;font-size:15px;color:#cfe}
  .goal img{display:block;margin:6px auto 0;width:160px;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
  .goal img.fb{filter:brightness(0) drop-shadow(0 0 6px rgba(255,255,255,.6))}
  #copied{font-size:14px;color:#9fe;min-height:18px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay" class="ov">
    <h1>Quality Rush</h1>
    <img id="flowTitle" class="flowBig" src="assets/ui/assembly_flow.webp" alt="" onerror="this.className='flowBig fb'">
    <div id="ovText"></div>
    <button id="startBtn" disabled>読み込み中…</button>
    <script>(function(){ var q = new URLSearchParams(location.search).get('lang'); var l = (q==='ja'||q==='en') ? q : ((navigator.language||'').slice(0,2)==='ja' ? 'ja' : 'en'); if (l==='en') document.getElementById('startBtn').textContent='Loading…'; })();</script>
    <button id="shareBtn" class="hidden"></button>
    <div id="copied"></div>
    <div id="langRow"><button id="langJa">日本語</button><button id="langEn">English</button></div>
  </div>
  <div id="pauseOv" class="ov hidden">
    <h1 id="pauseTitle"></h1>
    <img class="flowBig" src="assets/ui/assembly_flow.webp" alt="" onerror="this.className='flowBig fb'">
    <button id="resumeBtn"></button>
    <button id="muteBtn2" style="font-size:16px;padding:9px 20px;background:#445;color:#fff"></button>
  </div>
</div>
<script src="lib/matter.min.js"></script>
<script>
// ===== 設定（数字はここを変えれば調整できます） =====
const CONFIG = {
  W: 400, H: 760,           // 画面（下の40ピクセルは組み立ての流れバーとボタン）
  overflowGrace: 2.0,       // 危険ラインより上に部品がある状態が何秒続いたらゲームオーバーか
  // --- 難しさ：完成した車の台数＋経過時間（時間の分は毎フレームなめらかに変わる）。レベルは表示と車の種類・絵だけ ---
  dropTimeStart: 6,         // 0台のときの「落とすまでの制限時間」（秒）
  dropTimeFirst: 5.5,       // 1台完成したときの制限時間（秒）
  dropTimeStep: 0.25,       // そこから1台ごとに短くする秒数
  dropTimePerMin: 0.4,      // さらに経過1分ごとに短くする秒数（なめらかに）
  dropTimeMin: 1.5,         // いちばん短い制限時間（秒）
  warnBelow: 1.0,           // 残りこの秒数を切ったら警告音
  dropCooldown: 0.45,       // 落としたあと次を落とせるまでの秒数
  carsPerLevel: [1, 1],     // レベルアップに必要な車の台数（Lv1, Lv2, …）。表より先のレベルは carsPerLevelRest 台
  carsPerLevelRest: 2,
  defectFirst: 5,           // 1台完成したときの不良品の確率（%）（0台は0%）
  defectStep: 2,            // そこから1台ごとに増やす%
  defectPerMin: 3,          // さらに経過1分ごとに増やす%（1台目の完成後だけ・なめらかに）
  defectMax: 35,            // 不良品の確率の上限（%）
  noDefectSec: 60,          // 最初のこの秒数は不良品なし（さらに1台目の完成車までも不良品なし）
  floorTimeFrom: 60,        // この秒数から時間で床が上がり始める
  floorPerMin: 0.10,        // 1分ごとに床が上がる高さ＝箱の高さ×この割合（なめらかに）
  floorTimeMax: 0.40,       // 時間で上がる分の上限
  diffCountsBadCars: true,  // 難しさの台数に不良車も数えるか
  complaintRise: 0.05,      // クレーム1回で床が上がる高さ＝箱の高さ×この割合
  riseMax: 0.50,            // 床が上がる高さの上限（時間の分＋クレーム分の合計・箱の高さ×この割合）。クレームの数はこの中に収まる数まで
  recoverStreak: 3,         // 良品をこの台数連続で出庫すると、クレーム1回分床が下がる
  floorRiseSpeed: 40,       // 床が動く速さ（ピクセル/秒）
  // --- 何もしないと早く終わる：時間切れが続くと次の制限時間が短くなる ---
  idleSpeedup: 0.3,         // 時間切れ1回ごとに短くする秒数
  idleMinDrop: 1.5,         // そのときのいちばん短い制限時間（秒）。全体の最短 dropTimeMin より短くはならない
  idleReset: 1,             // 自分で落とす（捨てる）とこの回数で元に戻る
  // --- 部品（半径。色と形は COLORS／ITEM_DEFS） ---
  radius: { screw:14, wheel:18, tire:24, suspension:20, frame:30, engine:36, body:44,
            tire_wheel:28, suspension_frame:36, engine_chassis:50, rolling_chassis:62, body_car:74, car:90, mechanic:22 },
  // 落ちてくる部品の割合（ボディは必要なときだけ出るのでここでは0）
  dropWeights:     { screw:11, wheel:22, tire:22, suspension:11, frame:11, engine:11, body:0 },
  bodyOnDemand: true,       // 箱にローリングシャシー（赤✚）があってボディがどこにもないときだけボディを「次」に出す
  // --- 足りない部品を助ける：箱で相手を待っている部品の相手を出す確率 ---
  helpChanceEarly: 0.7,     // 足りない相手部品を出す確率：完成車が helpEarlyCars 台以下のとき（ここを変えるだけで調整できる）
  helpEarlyCars: 2,
  helpChance: 0.50,         // 足りない相手部品を出す確率：それより後
  // --- 良品を捨てたときの廃棄コスト（円・売上から引く。0円より下にはならない）。組み立て品は中の部品の合計 ---
  disposalCost: { screw:30000, wheel:50000, tire:50000, suspension:80000, frame:100000, engine:200000, body:300000, mechanic:0 },
  badCarPays: false,        // 不良車の出庫でも売上が入るか
  badCarCountsForLevel: false, // 不良車をレベルアップの台数に数えるか
  // --- 整備士 ---
  mechanicChance: 0.06,     // 1回の投下ごとに整備士が「次」に出る確率（1台目の完成後、箱に不良品があるときだけ）
  mechanicForceSec: 20,     // 不良品がこの秒数以上箱にあれば、次は必ず整備士（必ず出したら時計は0に戻る）
  mechanicForceCooldown: 30, // 必ず出す整備士は、前に必ず出した時からこの秒数たつまで出さない（6%の偶然は別）
  mechanicSeek: 40,         // 整備士が一番近い不良品へ横に動く速さ（ピクセル/秒）
  mechanicMax: 1,           // 同時に出る最大数
  mechanicRepairs: 1,       // 1人が直せる数
  mechanicTimeout: 8,       // 箱に入ってからこの秒数で帰る
  mechanicByeTime: 0.8,     // 「バイバイ」の絵を見せる秒数
  sparkleFrame: 0.08,       // キラキラ1コマの秒数
  // --- 演出 ---
  slowmoScale: 0.35,        // 良品の完成車：スローの速さ（1＝通常）
  slowmoTime: 0.5,          // スローの長さ（実時間の秒）
  countUpTime: 0.8,         // 売上のカウントアップの秒数
  complaintShake: 16,       // クレームの画面の揺れ
  maxParticles: 60,         // 煙・破片・コインなどの最大数（重くならないように）
  smokeInterval: 0.12,      // 不良車の煙を出す間隔（秒）
  smokeGrow: 1.3,           // 煙が広がる大きさ（車の大きさに対して）
  lowFpsMs: 24,             // 1フレームの平均がこれ(ms)を超えたら演出を間引く
  // --- 文字の出し方 ---
  bannerY: 200,             // お知らせの帯の高さ（箱の上のほうに固定）
  bannerTime: 1.2,          // お知らせ1つの表示秒数（重なるときは順番に。LEVEL UP も同じ列で、待ちがあれば先頭に入る）
  levelBannerColor: '#222', // LEVEL UP の文字の色
  bannerQueueMax: 4,        // 待たせるお知らせの最大数
  moneyTime: 0.8,           // 「+N万円」が浮かんで消えるまでの秒数
  moneyTopY: 240,           // 「+N万円」はこの高さで消える（お知らせの帯より下）
  moneyStackY: 28,          // 同時に出たときに下へずらす量（ピクセル）
  moneyStackDelay: 0.15,    // 同時に出たときに遅らせる秒数
  tagFall: 0.3,             // クレーム札が床に落ちるまでの秒数
  seqGap: 0.2,              // お金→札→お知らせ の間隔（秒）
  // --- Lv2の不良品ヒント ---
  hintShow: 3.5, hintDelayRankUp: 2.4, hintDelay: 1.0,
  // --- 画面上部の配置 ---
  nextX: 370, nextY: 70, nextMaxR: 18, gaugeRightPad: 84,
  binX: 14, binY: 178, binScale: 0.65,
  binTouchMargin: 4,        // 指が箱の左右の壁からこの距離以内（または外）なら、離すとゴミ箱へ
  binLift: 34,              // ゴミ箱モードで手持ち部品を浮かせる最大の高さ
  hudBottom: 90,            // 浮かせた部品の上端がこれより上に出ない（「次」・ゲージと重ならない）
  loadTimeout: 10,          // 画像の読み込みを待つ最長の秒数
  badgeImgScale: 1.03,      // 部品画像の幅＝直径×この倍率
  // --- 時間切れで自動で落ちた部品 ---
  autoDropNoMerge: true, autoDropAlpha: 0.55,
  // --- 下の流れバー・ボタン ---
  flowX: 6, flowY: 720, flowW: 312,         // 高さは画像の比率（9:1）から
  btnY: 737, btnR: 16, pauseX: 342, muteX: 380,
  flowHiResMinPx: 600,      // 画面上のバーの幅（端末ピクセル）がこれ以上なら 1080 の画像、未満なら 360 の画像
  // --- 効果音 ---
  sfxVolume: 0.6, sfxVolumeSoft: 0.4,
  // --- 部品の絵の仕様（レベルで変わる）。dir が null なら parts_v3 の直下をそのまま使う ---
  artTiers: [
    { name:'mass',   from:1, dir:'assets/parts_v3/mass/',   files:['engine','wheel','wheel_bad','tire_wheel'] },
    { name:'luxury', from:5, dir:'assets/parts_v3/luxury/', files:['engine','wheel','wheel_bad','tire_wheel'] },
    { name:'sport',  from:7, dir:null, files:[] },
  ],
};
const carsToLevelUp = lv => CONFIG.carsPerLevel[lv-1] ?? CONFIG.carsPerLevelRest; // Lv1・Lv2は1台、Lv3から2台
// ===== 部品と組み立て =====
// 色ごとの形の印（parts_colors.json と同じ）
const COLORS = {
  gray:{hex:'#9aa4b1', mark:'circle'}, blue:{hex:'#2f7fe0', mark:'square'}, green:{hex:'#2fb35a', mark:'triangle'},
  orange:{hex:'#f07a22', mark:'star'}, yellow:{hex:'#f2c230', mark:'diamond'}, red:{hex:'#e03a3a', mark:'cross'},
  white:{hex:'#ffffff', mark:'wrench'} };
// 同じ色の2つは必ず合体：同じ部品同士→同じ部品1つ（お金なし）、違う部品同士→下のレシピ
const ITEM_DEFS = [
  ['screw','gray',true], ['wheel','blue',true], ['tire','blue',true], ['suspension','green',true], ['frame','green',false],
  ['engine','orange',false], ['body','red',false], ['tire_wheel','yellow',false], ['suspension_frame','orange',false],
  ['engine_chassis','yellow',false], ['rolling_chassis','red',false], ['body_car','gray',false], ['car','gray',false], ['mechanic','white',false] ];
const ITEMS = ITEM_DEFS.map(([id,color,defect],i)=>({ i, id, color, defectable:defect, r:CONFIG.radius[id] }));
const K = {}; ITEMS.forEach(it => K[it.id] = it.i);
const RECIPES = [ // [色, 部品A, 部品B, できるもの]
  ['blue','wheel','tire','tire_wheel'], ['green','frame','suspension','suspension_frame'],
  ['orange','suspension_frame','engine','engine_chassis'], ['yellow','engine_chassis','tire_wheel','rolling_chassis'],
  ['red','rolling_chassis','body','body_car'], ['gray','body_car','screw','car'] ];
function recipeResult(ka, kb){
  if (ka === kb) return ka;
  const a = ITEMS[ka].id, b = ITEMS[kb].id;
  for (const [, x, y, out] of RECIPES) if ((x===a && y===b) || (x===b && y===a)) return K[out];
  return -1;
}
const R = k => ITEMS[k].r;
const DEFECTABLE = ITEMS.filter(it=>it.defectable).map(it=>it.i);
function pickWeighted(wobj, onlyKeys){
  const ent = Object.entries(wobj).filter(([id,w]) => w>0 && (!onlyKeys || onlyKeys.includes(K[id])));
  const sum = ent.reduce((a,[,w])=>a+w, 0); let r = Math.random()*sum;
  for (const [id,w] of ent){ if ((r -= w) < 0) return K[id]; }
  return K[ent[0][0]];
}
// 難しさに使う完成車の台数
const diffCars = () => state ? (CONFIG.diffCountsBadCars ? state.cars : state.carsGood) : 0;
// 不良品の出る確率（%）。n＝完成車の台数
const elapsedMin = () => state ? state.elapsed/60 : 0;
function defectChance(n = diffCars(), min = elapsedMin()){
  if (n < 1) return 0;
  return Math.min(CONFIG.defectMax, CONFIG.defectFirst + CONFIG.defectStep*(n-1) + CONFIG.defectPerMin*min);
}
// 廃棄コスト：組み立て品は中の部品の合計
const OUT_OF = {}; RECIPES.forEach(([, a, b, out]) => OUT_OF[out] = [a, b]);
function disposalCostOf(id){
  if (id in CONFIG.disposalCost) return CONFIG.disposalCost[id];
  return OUT_OF[id] ? OUT_OF[id].reduce((t, c) => t + disposalCostOf(c), 0) : 0;
}
// 車
const CAR_RANKS = [
  {src: 'assets/kei_truck_v01.webp',        scale: 1.0},
  {src: 'assets/cars/car_lv2_compact.webp', scale: 1.0},
  {src: 'assets/cars/car_lv3_sedan.webp',   scale: 1.05},
  {src: 'assets/cars/car_lv4_wagon.webp',   scale: 1.05},
  {src: 'assets/cars/car_lv5_suv.webp',     scale: 1.05},
  {src: 'assets/cars/car_lv6_offroad.webp', scale: 1.05},
  {src: 'assets/cars/car_lv7_super.webp',   scale: 1.05},
  {src: 'assets/cars/car_lv8_trailer.webp', scale: 0.85},
];
const CAR_VALUES = [1000000, 2000000, 3500000, 4000000, 5000000, 8000000, 20000000, 30000000];
const SILHOUETTES = ['kei','compact','sedan','wagon','suv','offroad','super','trailer'].map((n,i)=>`assets/cars/silhouette/car_lv${i+1}_${n}.webp`);
const CAR_NAMES = {
  ja:['軽トラ','コンパクトカー','セダン','ステーションワゴン','SUV','高級オフロード','ハイエンドスポーツ','トレーラー'],
  en:['Kei Truck','Compact Car','Sedan','Station Wagon','SUV','Luxury Off-Roader','Supercar','Semi Truck'] };
const TITLES = {
  ja:['見習い工員','ライン作業員','組立のプロ','班長','品質管理の鬼','工場長','伝説の職人','自動車王'],
  en:['Trainee','Line Worker','Assembly Pro','Team Leader','Quality Hawk','Plant Manager','Legendary Builder','Car Tycoon'] };

// ===== 画像の読み込み =====
const IMG_WAIT = [];   // スタート前に待つ画像
function loadImg(src, wait){
  const im = new Image(); im.ok = false;
  const p = new Promise(res => { im.onload = ()=>{ im.ok = true; res(); }; im.onerror = ()=>res(); });
  if (wait) IMG_WAIT.push(p);
  im.src = src; return im;
}
CAR_RANKS.forEach(r => r.img = loadImg(r.src, true));
// 部品の絵：ART.root は parts_v3 直下（sport とすべての予備）。仕様フォルダにない絵は直下の絵を使う
const ART = { root:{} };
const artKeys = [];
ITEMS.forEach(it => { if (it.id !== 'car'){ artKeys.push(it.id); if (it.defectable) artKeys.push(it.id+'_bad'); } });
artKeys.push('mechanic_bye');
artKeys.forEach(k => ART.root[k] = loadImg(`assets/parts_v3/badge_${k}.webp`, true));
const tierLoaded = {};
function ensureTier(name, wait){
  const t = CONFIG.artTiers.find(a=>a.name===name);
  if (!t || tierLoaded[name]) return; tierLoaded[name] = true;
  ART[name] = {};
  if (t.dir) t.files.forEach(f => ART[name][f] = loadImg(`${t.dir}badge_${f}.webp`, wait));
}
const tierIndexFor = lv => { let i = 0; CONFIG.artTiers.forEach((t,j)=>{ if (lv >= t.from) i = j; }); return i; };
const tierFor = lv => CONFIG.artTiers[tierIndexFor(lv)].name;
function preloadTiers(lv){  // いまの仕様と、次の仕様（裏で）
  const i = tierIndexFor(lv); ensureTier(CONFIG.artTiers[i].name, false);
  if (CONFIG.artTiers[i+1]) ensureTier(CONFIG.artTiers[i+1].name, false);
}
ensureTier(CONFIG.artTiers[0].name, true);   // 最初の仕様だけスタート前に読む
function artFor(k, bad, tier, bye){
  let key = ITEMS[k].id;
  if (bye) key = 'mechanic_bye'; else if (bad && ITEMS[k].defectable) key += '_bad';
  const t = ART[tier]; let im = t && t[key];
  if (im && im.ok) return im;
  im = ART.root[key]; if (im && im.ok) return im;
  if (key !== ITEMS[k].id){ im = ART.root[ITEMS[k].id]; if (im && im.ok) return im; }
  return null;
}
// 演出の画像（スタート後でもよいので待たない）
const FX = {}; let fxLoaded = false;
function loadFx(){
  if (fxLoaded) return; fxLoaded = true;
  const f = n => loadImg(`assets/fx/${n}.webp`, false);
  FX.coin = f('coin'); FX.tag = f('complaint_tag'); FX.crack = f('crack_overlay'); FX.flash = f('flash');
  FX.sparkle = [1,2,3,4].map(i=>f('sparkle_'+i)); FX.smokeB = [1,2,3,4].map(i=>f('smoke_black_'+i)); FX.smokeW = [1,2,3,4].map(i=>f('smoke_white_'+i));
  FX.debris = ['debris_1','debris_2','debris_3','debris_nut'].map(f);
  FX.partsBad = ['screw','wheel','tire','suspension'].map(n => loadImg(`assets/parts_v3/part_${n}_bad.webp`, false));
}
const UI = {};
UI.flowSlim = loadImg('assets/ui/assembly_flow_slim.webp', true);
UI.flowSlim360 = loadImg('assets/ui/assembly_flow_slim_360.webp', true);

function fmtYen(v){
  if (lang!=='ja') return `¥${v.toLocaleString()}`;
  if (v >= 100000000){
    const oku = Math.floor(v/100000000), man = (v - oku*100000000)/10000;
    return man > 0 ? `${oku}億${man.toLocaleString()}万円` : `${oku}億円`;
  }
  return v>=10000 ? `${(v/10000).toLocaleString()}万円` : `${v.toLocaleString()}円`;
}
const fmtTime = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const Store = {
  backend(){ try{ const d = window.CrazyGames && window.CrazyGames.SDK && window.CrazyGames.SDK.data; if (d && d.getItem) return d; }catch(e){} try{ return window.localStorage; }catch(e){ return null; } },
  get(k, def){ try{ const b=this.backend(); const v=b && b.getItem('qr_'+k); return v==null ? def : JSON.parse(v); }catch(e){ return def; } },
  set(k, v){ try{ const b=this.backend(); b && b.setItem('qr_'+k, JSON.stringify(v)); }catch(e){} }
};
const rankForLevel = lv => Math.min(lv, CAR_VALUES.length) - 1;
function drawCar(x, y, size, rank){
  const r = (CAR_RANKS[rank] && CAR_RANKS[rank].img.ok) ? CAR_RANKS[rank] : CAR_RANKS[0];

const { Engine, Bodies, Composite, Events } = Matter;
let engine, world, state, floorBody;

function newState(){
  const s = { running:false, paused:false, ending:0, cars:0, carsGood:0, carsBad:0, carsThisLevel:0, sales:0, salesShown:0, countRate:0, countDelay:0,
    level:1, discards:0, topRank:-1, rankUp:null,
    dropTimer:0, aimX:CONFIG.W/2, bin:0, current:null, next:null,
    canDrop:true, armed:false, overflowT:0, warnT:0, shipping:[], effects:[], popups:[], toasts:[], parts:[], elapsed:0,
    shake:0, flash:null, banner:null, hint:0, hintArmed:false, defectPending:false, queuedDrop:false, floorY:BOX.bottom,
    claims:0, claimSteps:0, goodStreak:0, money:[], tagDrops:[], repairs:0, mechanicsSpawned:0, mechForced:0, mechRandom:0, lastForcedT:-1e9, forceClock:-1e9, minDropLimit:99, idleCount:0, manualSinceIdle:0, slowmo:0, lastFloorTarget:BOX.bottom };
  state = s;
  s.current = randPiece(1); s.next = randPiece(1);
  return s;
}
const piece = (k, bad) => ({ k, bad: !!bad });
const gameBodies = () => world ? Composite.allBodies(world).filter(b => b.k !== undefined) : [];
const defectsAllowed = () => state.cars >= 1 && state.elapsed >= CONFIG.noDefectSec;
function mechanicCount(){
  let n = gameBodies().filter(b=>b.mech).length;
  if (state.current && state.current.k===K.mechanic) n++;
  if (state.next && state.next.k===K.mechanic) n++;
  return n;
}
const mechanicAllowed = () => state.cars >= 1 && gameBodies().some(b=>b.bad) && mechanicCount() < CONFIG.mechanicMax;
// 必ず出す整備士：不良品が20秒以上（前に必ず出した時からは時計を0に戻す）＋前に必ず出してから30秒
const defectAge = b => state.elapsed - Math.max(b.bornT, state.forceClock);
const mechanicForced = () => mechanicAllowed() && state.elapsed - state.lastForcedT >= CONFIG.mechanicForceCooldown && gameBodies().some(b => b.bad && defectAge(b) >= CONFIG.mechanicForceSec);
// 箱で相手を待っている部品の「相手」のうち、落ちてくる部品（ねじ〜エンジン）を集める
const PARTNERS = {}; RECIPES.forEach(([, a, b]) => { (PARTNERS[a] = PARTNERS[a] || []).push(b); (PARTNERS[b] = PARTNERS[b] || []).push(a); });
function neededParts(){
  const have = new Set();
  const bs = gameBodies().filter(b => !b.bad && !b.mech && !(CONFIG.autoDropNoMerge && b.autoDropped));
  bs.forEach(b => have.add(ITEMS[b.k].id));
  [state.current, state.next].forEach(p => { if (p && !p.bad) have.add(ITEMS[p.k].id); });
  const need = new Set();
  const want = (id, depth) => {          // id がなければ、それ（または材料）を欲しがる
    if (have.has(id) || depth > 4) return;
    if (CONFIG.dropWeights[id] > 0) { need.add(id); return; }
    if (OUT_OF[id]) OUT_OF[id].forEach(c => want(c, depth+1));
  };
  bs.forEach(b => (PARTNERS[ITEMS[b.k].id] || []).forEach(pid => want(pid, 0)));
  return [...need];
}
function bodyNeeded(){  // ローリングシャシーがあってボディがどこにもないとき
  const bs = gameBodies();
  const hasRolling = bs.some(b => b.k===K.rolling_chassis && !(CONFIG.autoDropNoMerge && b.autoDropped));
  const hasBody = bs.some(b => b.k===K.body) || [state.current, state.next].some(p => p && p.k===K.body);
  return hasRolling && !hasBody;
}
function randPiece(lv){
  if (state.running){
    const forced = mechanicForced();
    if (forced || (mechanicAllowed() && Math.random() < CONFIG.mechanicChance)){ state.mechanicsSpawned++;
      if (forced){ state.mechForced++; state.lastForcedT = state.elapsed; state.forceClock = state.elapsed; } else state.mechRandom++; toast(L().mechanic, '#fff'); sfx('mechanic_in'); return piece(K.mechanic); }
    if (CONFIG.bodyOnDemand && bodyNeeded()) return piece(K.body);
    if (defectsAllowed() && Math.random()*100 < defectChance()) return piece(pickWeighted(CONFIG.dropWeights, DEFECTABLE), true);
    const help = diffCars() <= CONFIG.helpEarlyCars ? CONFIG.helpChanceEarly : CONFIG.helpChance;
    const need = neededParts();
    if (need.length && Math.random() < help){ state.helped = (state.helped||0) + 1; return piece(K[need[Math.floor(Math.random()*need.length)]]); }
  }
  return piece(pickWeighted(CONFIG.dropWeights));
}
function dropLimitAt(n, min = elapsedMin()){   // n＝完成車の台数、min＝経過分
  const byCars = n < 1 ? CONFIG.dropTimeStart : CONFIG.dropTimeFirst - CONFIG.dropTimeStep*(n-1);
  return Math.max(CONFIG.dropTimeMin, byCars - CONFIG.dropTimePerMin*min);
}
function dropLimit(){
  const base = dropLimitAt(diffCars());
  if (!state.idleCount) return base;
  return Math.max(CONFIG.dropTimeMin, Math.min(base, Math.max(CONFIG.idleMinDrop, base - CONFIG.idleSpeedup*state.idleCount)));   // 全体の最短より短くしない
}
// 床の高さ：時間の分（60秒から）＋クレームの分。合計は riseMax まで
const timeRiseFrac = (t = state.elapsed) => t < CONFIG.floorTimeFrom ? 0 : Math.min(CONFIG.floorTimeMax, CONFIG.floorPerMin*(t-CONFIG.floorTimeFrom)/60);
const claimCap = () => Math.max(0, Math.floor((CONFIG.riseMax - timeRiseFrac())/CONFIG.complaintRise + 1e-6));
function clampClaims(){ if (state.claimSteps > claimCap()) state.claimSteps = claimCap(); }
const riseFrac = () => Math.min(CONFIG.riseMax, timeRiseFrac() + state.claimSteps*CONFIG.complaintRise);
const floorTarget = () => BOX.bottom - BOX_H*riseFrac();

function setupWorld(){
  engine = Engine.create(); engine.gravity.y = 1.1; world = engine.world;
  const o = { isStatic:true, friction:0.3 };
  floorBody = Bodies.rectangle((BOX.left+BOX.right)/2, BOX.bottom+15, BOX.right-BOX.left, 30, o);
  Composite.add(world, floorBody);
  Composite.add(world, [
    Bodies.rectangle((BOX.left+BOX.right)/2, BOX.bottom+15, BOX.right-BOX.left+60, 30, o),
    Bodies.rectangle(BOX.left-15, (BOX.top+BOX.bottom)/2, 30, BOX.bottom-BOX.top+400, o),
    Bodies.rectangle(BOX.right+15, (BOX.top+BOX.bottom)/2, 30, BOX.bottom-BOX.top+400, o),
  ]);
  Events.on(engine, 'collisionStart', onCollide);
  Events.on(engine, 'collisionActive', onCollide);  // くっついたまま止まっている組み合わせも合体・修理する
}
// 床を目標の高さへ少しずつ動かす（上にも下にも）
function stepFloor(){
  clampClaims();
  const target = floorTarget();
  if (target < state.lastFloorTarget - 0.5 && state.running) sfx('floor_rise');
  state.lastFloorTarget = target;
  if (Math.abs(state.floorY - target) < 0.01) return;
  const d = CONFIG.floorRiseSpeed*PHYS_STEP/1000;
  const ny = state.floorY > target ? Math.max(target, state.floorY - d) : Math.min(target, state.floorY + d);
  Matter.Body.setPosition(floorBody, { x: floorBody.position.x, y: ny + 15 });
  state.floorY = ny;
}
function makePart(k, x, y, opts){
  if (typeof k === 'string') k = K[k];
  opts = opts || {};
  const b = Bodies.circle(x, y, R(k), { restitution:0.15, friction:0.1, density:0.0015 });
  b.k = k; b.tier = k; b.bad = !!opts.bad && k !== K.mechanic; b.mech = k === K.mechanic;
  b.art = opts.art || tierFor(state.level); b.bornT = state.elapsed; b.born = performance.now();
  if (opts.auto) b.autoDropped = true;
  Composite.add(world, b); return b;
}
const merging = new Set();
function onCollide(ev){
  if (!state.running) return;
  for (const p of ev.pairs){
    const a=p.bodyA, b=p.bodyB;
    if (a.k===undefined || b.k===undefined) continue;
    if (merging.has(a.id)||merging.has(b.id)) continue;
    if (a.mech || b.mech){  // 整備士：不良品に触れたら直す（整備士同士・良品とは何もしない）
      const m = a.mech ? a : b, o = a.mech ? b : a;
      m.landed = true;
      if (!o.mech && o.bad && !m.bye && !m.done) repair(m, o);
      continue;
    }
    if (ITEMS[a.k].color !== ITEMS[b.k].color) continue;
    if (CONFIG.autoDropNoMerge && (a.autoDropped || b.autoDropped)) continue;
    const nk = recipeResult(a.k, b.k); if (nk < 0) continue;
    merging.add(a.id); merging.add(b.id);
    const x=(a.position.x+b.position.x)/2, y=(a.position.y+b.position.y)/2, bad = a.bad || b.bad, same = a.k===b.k, color = ITEMS[a.k].color;
    const s0 = state;
    setTimeout(()=>{
      Composite.remove(world,a); Composite.remove(world,b);
      merging.delete(a.id); merging.delete(b.id);
      if (state !== s0 || !state.running) return;
      state.effects.push({x,y,r:R(nk),t:0});
      if (nk === K.car){ shipCar(x, y, bad); return; }
      makePart(nk, x, y, {bad});
      state.shake = Math.max(state.shake, same ? 1.5 : 3);
      if (same) state.popups.push({ text:L().stack, color:'#cfe', x, y:y-R(nk)-6, t:0, size:14 });
      sfx(['blue','green'].includes(color) ? 'merge' : 'merge_big');
    },0);
  }
}
function repair(m, o){
  m.done = true; o.bad = false; state.repairs++;
  Composite.remove(world, m);
  addParticle({ frames:FX.sparkle, frameDur:CONFIG.sparkleFrame, x:o.position.x, y:o.position.y, s0:o.circleRadius*2.4, s1:o.circleRadius*2.6, life:CONFIG.sparkleFrame*8, fb:'sparkle', fade:false });
  addParticle({ art:artFor(K.mechanic,false,'root',true), x:m.position.x, y:m.position.y, vy:-90, s0:R(K.mechanic)*2, s1:R(K.mechanic)*2, life:0.8 });
  state.popups.push({ text:L().repaired, color:'#7fffb0', x:o.position.x, y:o.position.y-o.circleRadius-8, t:0 });
  sfx('repair');
}
function shipCar(x, y, bad){
  const rank = rankForLevel(state.level), fullValue = CAR_VALUES[rank];
  const value = (!bad || CONFIG.badCarPays) ? fullValue : 0;
  state.cars++; state.topRank = Math.max(state.topRank, rank);
  if (value){ state.sales += value; state.countRate = (state.sales - state.salesShown)/CONFIG.countUpTime; state.countDelay = 0.35; }
  state.shipping.push({x, y, phase:0, rank, value, bad, smokeT:0});
  let seq = 0;   // お金 → 札 → お知らせ の順に少しずつずらす
  if (value){ moneyPop(x, y - R(K.car) - 10, `+${fmtYen(value)}`); seq += CONFIG.seqGap; }
  if (bad){
    state.carsBad++; state.claims++; state.goodStreak = 0;
    clampClaims();
    if (state.claimSteps < claimCap()){ state.claimSteps++; state.tagDrops.push({ i: state.claimSteps-1, t: -seq }); }   // 上限を超えたクレームは数えない
    else state.tagDrops.push({ i: -1, t: -seq });   // 数えないときも1回だけ揺らす
    seq += CONFIG.seqGap;
    toast(L().badCar, '#ff9a8a', 0, seq, { bad:true });
    sfx('defect_putter'); setTimeout(()=>sfx('complaint'), 350);
  } else {
    state.carsGood++; state.goodStreak++; state.shake = 8;
    state.slowmo = CONFIG.slowmoTime;
    if (state.goodStreak >= CONFIG.recoverStreak && state.claimSteps > 0){ state.claimSteps--; state.goodStreak = 0; toast(L().recover, '#7fffb0', 0, seq, { streak:true }); }
    sfx('complete'); setTimeout(()=>sfx('coin'), 450);
    for (let i=0;i<6;i++) addParticle({ coin:true, art:FX.coin, x0:x+(Math.random()-.5)*60, y0:y+(Math.random()-.5)*40, tx:60, ty:20, delay:0.15+i*0.06, life:0.75+i*0.06, s0:20, s1:14, fb:'coin', fade:false });
  }
  if (!bad || CONFIG.badCarCountsForLevel){
    state.carsThisLevel++;
    if (state.carsThisLevel >= carsToLevelUp(state.level)) levelUp();
  }
}
function levelUp(){
  const oldRank = rankForLevel(state.level), oldTier = tierIndexFor(state.level);
  state.level++; state.carsThisLevel = 0;
  const nr = rankForLevel(state.level);
  if (nr > oldRank) state.rankUp = { rank:nr, t:-0.9, dur:1.5 };
  toast(`${L().levelUp}  Lv${state.level}`, CONFIG.levelBannerColor, 0, 0, { level:true, front:true });
  state.flash = { color:'255,255,255', t:0, dur:0.25 };
  sfx('level_up');
  preloadTiers(state.level);
  const nt = tierIndexFor(state.level);
  if (nt > oldTier){ const n = CONFIG.artTiers[nt].name; if (n==='luxury') toast(L().tierLuxury, '#ffd84a', 2.6); if (n==='sport') toast(L().tierSport, '#ffd84a', 2.6); }
  if (state.level === 2) state.defectPending = true;  // Lv2：最初の不良品をヒントつきで出す（不良品が出せる状態になってから）
}
// お知らせ：1つずつ順番に（重ねない）。wait 秒たってから並ぶ
function toast(text, color, dur, wait, opt = {}){
  const t = { text, color, t:0, dur: CONFIG.bannerTime, wait: wait||0, level: !!opt.level, streak: !!opt.streak };
  if (opt.bad) state.toasts = state.toasts.filter(o => !o.streak);   // 不良車のときは古い「3台連続で良品！」を捨てる
  if (opt.front){   // 待ちがあれば先頭へ（いま出ているものは最後まで出す）
    const showing = state.toasts.findIndex(o => !(o.wait > 0) && o.t > 0);
    let i = showing >= 0 ? showing+1 : 0; while (state.toasts[i] && state.toasts[i].level) i++;   // LEVEL UP 同士は順番どおり
    state.toasts.splice(i, 0, t);
  } else state.toasts.push(t);
  if (state.toasts.length > CONFIG.bannerQueueMax + 1) state.toasts.splice(state.toasts.length-2, 1);
}
// お金の文字の高さ：車の位置から上へ、moneyTopY で消える（お知らせの帯より上へは行かない）
const moneyY = (m, k) => { const y0 = Math.max(m.y, CONFIG.moneyTopY + 12); return y0 + (CONFIG.moneyTopY - y0)*Math.min(1, k); };
// お金の文字：車の位置から浮かんで消える。同時なら下へずらして少し遅らせる
function moneyPop(x, y, text){
  const n = state.money.filter(m => m.t < CONFIG.moneyStackDelay*4).length;
  state.money.push({ x, y: y + n*CONFIG.moneyStackY, text, t: -n*CONFIG.moneyStackDelay });
}
function addParticle(p){
  if (!p.frames && state.parts.length >= CONFIG.maxParticles * (frameAvg > CONFIG.lowFpsMs ? 0.5 : 1)) return;   // 修理のキラキラは間引かない
  state.parts.push(Object.assign({ t:0, vx:0, vy:0, g:0, rot:0, vr:0, a0:1, s0:20, s1:20, life:1, fade:true, delay:0 }, p));
}

// ===== 操作 =====
let activePointer = null;
function toGame(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) * CONFIG.W / r.width, y:(e.clientY - r.top) * CONFIG.H / r.height }; }
const toGameX = clientX => { const r = cv.getBoundingClientRect(); return (clientX - r.left) * CONFIG.W / r.width; };
function setAim(rawX){
  const r = R(state.current.k), m = CONFIG.binTouchMargin;
  state.bin = rawX < BOX.left + m ? -1 : (rawX > BOX.right - m ? 1 : 0);
  state.aimX = clampAim(rawX, r);
}
const clampAim = (x, r) => Math.max(BOX.left+r, Math.min(BOX.right-r, x));
function hitButton(g){
  const d = (x,y) => Math.hypot(g.x-x, g.y-y) <= CONFIG.btnR + 6;
  if (d(CONFIG.pauseX, CONFIG.btnY)) return 'pause';
  if (d(CONFIG.muteX, CONFIG.btnY)) return 'mute';
  return null;
}
cv.addEventListener('pointerdown', e=>{
  if (!state.running || state.paused || !e.isPrimary || activePointer!==null) return;
  const btn = hitButton(toGame(e));
  if (btn === 'pause'){ pauseGame(); return; }
  if (btn === 'mute'){ setMuted(!muted); return; }
  activePointer = e.pointerId; state.armed = true; state.queuedDrop = false; setAim(toGameX(e.clientX));
});
cv.addEventListener('pointermove', e=>{
  if (!state.running || state.paused) return;
  if (activePointer!==null && e.pointerId!==activePointer) return;
  if (activePointer===null && e.pointerType!=='mouse') return;
  setAim(toGameX(e.clientX));
});
function release(e){
  if (e.pointerId!==activePointer) return;
  activePointer = null;
  if (!state.running || state.paused) return;
  setAim(toGameX(e.clientX));
  if (state.armed){
    if (state.canDrop) drop();
    else state.queuedDrop = true;
  }
  state.armed = false;
}
cv.addEventListener('pointerup', release);

function drop(auto){
  if (!state.canDrop || !state.running) return;
  state.armed = false; state.queuedDrop = false;
  const p = state.current;
  if (auto){
    const r = R(p.k), x = BOX.left + r + Math.random()*(BOX.right - BOX.left - 2*r);
    makePart(p.k, x, HOLD_Y, { bad:p.bad, auto:true });
    state.idleCount++; state.manualSinceIdle = 0;     // 時間切れが続くほど次の制限時間が短くなる
  } else {
    if (state.bin !== 0) discard(p); else { makePart(p.k, state.aimX, HOLD_Y, { bad:p.bad }); sfx('drop'); }
    if (state.idleCount && ++state.manualSinceIdle >= CONFIG.idleReset){ state.idleCount = 0; state.manualSinceIdle = 0; }
  }
  state.current = state.next; state.next = randPiece(state.level);
  if (state.bin === 0) setAim(state.aimX);
  state.dropTimer = 0; state.canDrop = false;
  const s0 = state;
  setTimeout(()=>{
    if (state !== s0) return;
    state.canDrop = true;
    if (state.queuedDrop && state.running && !state.paused) drop();
  }, CONFIG.dropCooldown*1000);
}
function discard(p){
  state.discards++;
  const x = state.bin<0 ? BOX.left+6 : BOX.right-6;
  let text = L().okDiscard, good = p.bad || p.k===K.mechanic;
  if (!good){
    const cost = disposalCostOf(ITEMS[p.k].id), before = state.sales;
    state.sales = Math.max(0, state.sales - cost);
    if (state.salesShown > state.sales) state.salesShown = state.sales;
    text = L().scrap(before - state.sales);
  }
  if (p.k === K.mechanic) text = L().mechanicLeft;
  state.popups.push({ text, color: good ? '#5be37d' : '#ff4a3a', x: state.bin<0 ? 110 : 290, y: HOLD_Y+40, t:0 });
  state.effects.push({x, y:HOLD_Y, r:24, t:0});
  sfx('discard');
}

// ===== 効果音 =====
const SFX_NAMES = ['drop','merge','merge_big','complete','coin','defect_putter','discard','complaint','floor_rise','warning','mechanic_in','repair','level_up','game_over'];
const SFX_SOFT = ['drop','merge'];
let actx, audioUnlocked = false, sfxLoading = false, muted = !!Store.get('muted', false);
const sfxBuf = {}, sfxEl = {};
function resumeAudio(){   // 最初に画面に触れたときだけ音を使えるようにする（それまでは鳴らさない）
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state !== 'running') actx.resume();
  }catch(e){}
  audioUnlocked = true; loadSfx();
}
['pointerdown','touchend','click','keydown'].forEach(ev => window.addEventListener(ev, resumeAudio, {passive:true}));
function loadSfx(){
  if (sfxLoading) return; sfxLoading = true;
  let ext = 'mp3'; try{ if (document.createElement('audio').canPlayType('audio/ogg; codecs="vorbis"')) ext = 'ogg'; }catch(e){}
  SFX_NAMES.forEach(n => {
    const src = `assets/sfx/${n}.${ext}`;
    const fallback = () => { try{ const el = new Audio(src); el.preload = 'auto'; sfxEl[n] = el; }catch(e){} };
    if (!actx || !window.fetch || location.protocol === 'file:') { fallback(); return; }
    fetch(src).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(b => new Promise((res, rej) => actx.decodeAudioData(b, res, rej)))
      .then(buf => { sfxBuf[n] = buf; }).catch(fallback);
  });
}
function sfx(name){
  if (muted || !audioUnlocked) return;
  const vol = SFX_SOFT.includes(name) ? CONFIG.sfxVolumeSoft : CONFIG.sfxVolume;
  try{
    if (sfxBuf[name] && actx && actx.state === 'running'){
      const s = actx.createBufferSource(), g = actx.createGain(); g.gain.value = vol;
      s.buffer = sfxBuf[name]; s.connect(g).connect(actx.destination); s.start(); return;
    }
    if (sfxEl[name]){ const el = sfxEl[name].cloneNode(); el.volume = vol; const pr = el.play(); if (pr) pr.catch(()=>{}); }
  }catch(e){}
}
function beep(freq, dur){   // 制限時間の残りわずかの「ピッ」
  if (muted || !audioUnlocked) return;
  try{
    if (!actx || actx.state !== 'running') return;
    const o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=freq; o.type='triangle';
    g.gain.setValueAtTime(0.12, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function setMuted(v){ muted = !!v; Store.set('muted', muted); renderPause(); }

// ===== ループ =====
const PHYS_STEP = 1000/60, PHYS_MAX_STEPS = 5;
let last = performance.now(), physAcc = 0;
let frameAvg = 16.7;
function loop(now){
  const rdt = Math.min(0.05, (now-last)/1000); last = now;
  frameAvg = frameAvg*0.9 + rdt*1000*0.1;   // 重いときは煙などを間引く
  if (state.paused){ draw(now); requestAnimationFrame(loop); return; }
  if (state.slowmo > 0) state.slowmo -= rdt;
  const dt = state.slowmo > 0 ? rdt*CONFIG.slowmoScale : rdt;   // 良品の完成車の瞬間だけスロー
  if (state.running){
    physAcc += dt*1000; let n = 0;
    while (physAcc >= PHYS_STEP && n < PHYS_MAX_STEPS){ stepFloor(); Engine.update(engine, PHYS_STEP); physAcc -= PHYS_STEP; n++; }
    if (n === PHYS_MAX_STEPS) physAcc = 0;
    state.elapsed += dt;
    if (state.canDrop){
      const lim = dropLimit(); if (lim < state.minDropLimit) state.minDropLimit = lim; const before = lim-state.dropTimer; state.dropTimer += dt; const left = lim-state.dropTimer;
      if (left <= CONFIG.warnBelow && Math.ceil(left*4)!==Math.ceil(before*4)) beep(1500,0.03);
      if (state.dropTimer >= lim) drop(true);
    }
    let over=false;
    for (const b of gameBodies()){
      if (b.mech){  // 整備士：時間で帰る
        if (!b.bye && state.elapsed - b.bornT > CONFIG.mechanicTimeout){ b.bye = true; b.byeT = state.elapsed; state.popups.push({ text:L().mechanicLeft, color:'#ddd', x:b.position.x, y:b.position.y-30, t:0, size:14 }); }
        if (b.bye && state.elapsed - b.byeT > CONFIG.mechanicByeTime) Composite.remove(world, b);
        else if (!b.bye && !b.done){
          // 着地したら「すり抜け」にする：ほかの部品を押さない・落ちない（静止＋センサー）
          if (!b.parked && (b.landed || (state.elapsed - b.bornT > 0.4 && Math.hypot(b.velocity.x, b.velocity.y) < 0.6) || b.position.y + b.circleRadius >= state.floorY - 1)){
            b.parked = true; Matter.Body.setVelocity(b, {x:0, y:0}); Matter.Body.setStatic(b, true); b.isSensor = true;
          }
          // 一番近い不良品の方へゆっくり動く（横が先。重なったら直す）
          let best = null, bd = 1e9;
          for (const o of gameBodies()) if (o.bad){ const d = Math.hypot(o.position.x-b.position.x, o.position.y-b.position.y); if (d < bd){ bd = d; best = o; } }
          if (best && bd <= b.circleRadius + best.circleRadius + 1){ repair(b, best); continue; }
          if (best && b.parked){ const step = CONFIG.mechanicSeek*dt, dx = best.position.x - b.position.x, dy = best.position.y - b.position.y;
            let nx = b.position.x, ny = b.position.y;
            if (Math.abs(dx) > 2) nx += Math.sign(dx)*Math.min(step, Math.abs(dx)); else ny += Math.sign(dy)*Math.min(step, Math.abs(dy));
            Matter.Body.setPosition(b, { x: Math.max(BOX.left+b.circleRadius, Math.min(BOX.right-b.circleRadius, nx)), y: Math.max(BOX.top+b.circleRadius, Math.min(state.floorY-b.circleRadius, ny)) }); }
        }
        continue;
      }
      if (state.elapsed - b.bornT > 1.2 && b.position.y - b.circleRadius < DANGER_Y && Math.abs(b.velocity.y)<1) over=true;
    }
    state.overflowT = over ? state.overflowT+dt : 0;
    if (over){ state.warnT -= dt; if (state.warnT <= 0){ sfx('warning'); state.warnT = 0.8; } } else state.warnT = 0;
    if (state.overflowT > CONFIG.overflowGrace) startEnding();
    // Lv2の最初の不良品：不良品が出せるようになったらヒントを予約して「次」に出す
    if (state.defectPending && !state.hintArmed && defectsAllowed()){ state.hintArmed = true; state.hint = CONFIG.hintShow + (state.rankUp ? CONFIG.hintDelayRankUp : CONFIG.hintDelay); }
    if (state.defectPending && state.hintArmed && state.hint <= CONFIG.hintShow){ state.next = piece(pickWeighted(CONFIG.dropWeights, DEFECTABLE), true); state.defectPending = false; }
  } else if (state.ending > 0){
    state.ending -= rdt;
    if (state.ending <= 0) showResult();
  }
  // 売上のカウントアップ
  if (state.countDelay > 0) state.countDelay -= rdt;
  else if (state.salesShown < state.sales) state.salesShown = Math.min(state.sales, state.salesShown + Math.max(1000, state.countRate*rdt));
  if (state.salesShown > state.sales) state.salesShown = state.sales;
  for (const s of state.shipping){
    s.phase += dt;
    if (s.bad && s.phase > 0.3){  // 不良車：黒煙・白煙と部品のかけらを落としながら走る
      s.smokeT -= rdt;
      if (s.smokeT <= 0){ s.smokeT = CONFIG.smokeInterval * (frameAvg > CONFIG.lowFpsMs ? 2 : 1); const p = shipPos(s);
        const black = Math.random() < 0.65, fr = black ? FX.smokeB : FX.smokeW;
        addParticle({ art: fr && fr[Math.floor(Math.random()*4)], fb: black ? 'smokeB' : 'smokeW', x:p.x-p.size*0.9, y:p.y-6, vx:-40-Math.random()*40, vy:-30-Math.random()*30, s0:p.size*0.6, s1:p.size*CONFIG.smokeGrow, life:0.8, rot:Math.random()*6, vr:(Math.random()-.5)*2 });
        if (Math.random() < 0.25) debris(p.x, p.y, 1);
      }
      if (!s.burst && s.phase > 0.35){ s.burst = true; const p = shipPos(s); debris(p.x, p.y, 7); }
    }
  }
  state.shipping = state.shipping.filter(s=>s.phase<2.4);
  for (const e of state.effects) e.t += rdt;
  state.effects = state.effects.filter(e=>e.t<0.35);
  for (const p of state.popups) p.t += rdt;
  state.popups = state.popups.filter(p=>p.t<1.2);
  for (const t of state.toasts) if (t.wait > 0) t.wait -= rdt;
  { const head = state.toasts.find(t => !(t.wait > 0)); if (head) head.t += rdt; }   // 1つずつ順番に
  state.toasts = state.toasts.filter(t=>t.t<t.dur);
  for (const m of state.money) m.t += rdt;
  state.money = state.money.filter(m => m.t < CONFIG.moneyTime);
  for (const d of state.tagDrops){ const was = d.t; d.t += rdt; if (was < CONFIG.tagFall && d.t >= CONFIG.tagFall) state.shake = Math.max(state.shake, CONFIG.complaintShake); }
  state.tagDrops = state.tagDrops.filter(d => d.t < CONFIG.tagFall);
  for (const p of state.parts){
    if (p.delay > 0){ p.delay -= rdt; continue; }
    p.t += rdt; p.x += p.vx*rdt; p.y += p.vy*rdt; p.vy += p.g*rdt; p.rot += p.vr*rdt;
  }
  state.parts = state.parts.filter(p=>p.t<p.life);
  if (state.rankUp){ state.rankUp.t += rdt; if (state.rankUp.t > state.rankUp.dur) state.rankUp = null; }
  if (state.banner){ state.banner.t += rdt; if (state.banner.t > state.banner.dur) state.banner = null; }
  if (state.flash){ state.flash.t += rdt; if (state.flash.t > state.flash.dur) state.flash = null; }
  if (state.hint > 0) state.hint -= dt;
  state.shake *= 0.85;
  draw(now);
  requestAnimationFrame(loop);
}
function debris(x, y, n){

    const usePart = Math.random() < 0.35, list = usePart ? FX.partsBad : FX.debris;
    addParticle({ art: list && list[Math.floor(Math.random()*list.length)], fb:'debris', x, y, vx:-160+Math.random()*200, vy:-260+Math.random()*140, g:900,

// 出庫の車の位置：合体した場所で大きく表示 → レーンへ降りる → 画面の端まで走り去る
function shipPos(s){
  const W = CONFIG.W, CR = R(K.car);
  if (s.phase<0.35) return { x:s.x, y:s.y, size: CR*(0.6+0.4*Math.min(1,s.phase/0.15)) };
  if (s.phase<0.8){ const k=(s.phase-0.35)/0.45; return { x:s.x, y:s.y+(LANE_Y-s.y)*k*k, size: CR + (42-CR)*k }; }

function drawMark(mark, s){
  ctx.fillStyle = '#fff'; ctx.beginPath();

  else if (mark==='triangle'){ ctx.moveTo(0,-s*0.75); ctx.lineTo(s*0.7,s*0.55); ctx.lineTo(-s*0.7,s*0.55); ctx.closePath(); }

  else if (mark==='diamond'){ ctx.moveTo(0,-s*0.8); ctx.lineTo(s*0.6,0); ctx.lineTo(0,s*0.8); ctx.lineTo(-s*0.6,0); ctx.closePath(); }
  else if (mark==='cross'){ ctx.rect(-s*0.22,-s*0.7,s*0.44,s*1.4); ctx.rect(-s*0.7,-s*0.22,s*1.4,s*0.44); }

function drawPart(k, bad, x, y, angle, now, tier, bye){

      ctx.fillStyle = i < state.carsThisLevel ? '#f5b700' : 'rgba(255,255,255,.22)'; ctx.fillRect(x0, 40, sw, 10);
    }
    ctx.fillStyle='#fff'; ctx.font='bold 16px sans-serif'; ctx.textBaseline='top';
  }
  if (state.running){
    ctx.textAlign='right';
    ctx.fillStyle = low ? (Math.sin(now/90)>0 ? '#ff4a3a' : '#ffb0a8') : '#fff';
    ctx.fillText(`${L().drop} ${leftT.toFixed(1)}s`, W-14, 12);
  }
  const gw = W - CONFIG.gaugeRightPad - BOX.left;
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(BOX.left, GAUGE_Y, gw, GAUGE_H);
  if (state.running){
    ctx.fillStyle = low ? (Math.sin(now/90)>0 ? '#ff3b2f' : '#ff8a7a') : '#f5b700';
    ctx.fillRect(BOX.left, GAUGE_Y, gw*Math.min(1, leftT/limit), GAUGE_H);
  }
  if (state.next){ const nr = R(state.next.k), sc = Math.min(1, CONFIG.nextMaxR/nr);
    ctx.fillStyle='#fff'; ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.font='13px sans-serif';
    ctx.fillText(L().next, CONFIG.nextX-CONFIG.nextMaxR-4, CONFIG.nextY);
    ctx.save(); ctx.translate(CONFIG.nextX, CONFIG.nextY); ctx.scale(sc, sc); drawPart(state.next.k, state.next.bad, 0, 0, 0, now); ctx.restore(); }
  for (const b of gameBodies()){
    if (b.autoDropped && CONFIG.autoDropNoMerge && !b.mech){
      ctx.save(); ctx.globalAlpha = CONFIG.autoDropAlpha; drawPart(b.k, b.bad, b.position.x, b.position.y, b.angle, now, b.art); ctx.restore();
      ctx.beginPath(); ctx.arc(b.position.x, b.position.y, b.circleRadius-1.5, 0, Math.PI*2); ctx.lineWidth=3; ctx.strokeStyle='rgba(150,155,165,.9)'; ctx.stroke();
    } else if (b.mech){
      ctx.save(); if (b.bye) ctx.globalAlpha = Math.max(0, 1 - (state.elapsed-b.byeT)/CONFIG.mechanicByeTime);
      drawPart(b.k, false, b.position.x, b.position.y, 0, now, 'root', b.bye); ctx.restore();
    } else drawPart(b.k, b.bad, b.position.x, b.position.y, b.angle, now, b.art);
  }
  drawBin(-1, now); drawBin(1, now);
  for (const e of state.effects){
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r*(1+e.t*3),0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,230,120,${1-e.t/0.35})`; ctx.lineWidth=4; ctx.stroke();
  }
  // 床：在庫の箱（レベル）＋クレームの札
  ctx.fillStyle='#3b4a60'; ctx.fillRect(BOX.left-10, BOX.bottom, BOX.right-BOX.left+20, 12);
  if (state.floorY < BOX.bottom - 0.5){
    const top = state.floorY, hh = BOX.bottom - top, cw = 45, ch = 23;
    ctx.save(); ctx.beginPath(); ctx.rect(BOX.left, top, BOX.right-BOX.left, hh); ctx.clip();
    ctx.fillStyle='#6b4f2e'; ctx.fillRect(BOX.left, top, BOX.right-BOX.left, hh);
    ctx.strokeStyle='#3e2c17'; ctx.lineWidth=2;
    for (let row=0; row*ch < hh; row++){
      const y = BOX.bottom - (row+1)*ch, off = (row%2) ? cw/2 : 0;
      for (let x = BOX.left - off; x < BOX.right; x += cw){
        ctx.fillStyle = (row+Math.round(x/cw))%2 ? '#a5793f' : '#94692f'; ctx.fillRect(x+1, y+1, cw-2, ch-2);
        ctx.strokeRect(x+1, y+1, cw-2, ch-2); ctx.beginPath(); ctx.moveTo(x+4, y+ch/2); ctx.lineTo(x+cw-4, y+ch/2); ctx.stroke();
      }
    }
    ctx.restore();
    ctx.fillStyle='#3b4a60'; ctx.fillRect(BOX.left, top-4, BOX.right-BOX.left, 4);
  }
  if (state.claimSteps > 0){   // クレーム1回ごとに札を床に重ねる
    const tw = 66, th = 21, rows = Math.max(1, Math.floor((BOX.bottom - state.floorY - 2)/(th+2))), cols = 5;
    const tag = FX.tag;
    for (let i=0;i<state.claimSteps;i++){
      const row = i % rows, col = Math.floor(i/rows) % cols, layer = Math.floor(i/(rows*cols));
      const x = BOX.left + 8 + col*(tw+5) + (row%2)*6 + layer*4, y = state.floorY + 3 + row*(th+2) - layer*3;
      const fall = state.tagDrops.find(d => d.i === i);
      if (fall && fall.t < 0) continue;   // まだ落ちてこない
      if (fall){ const k = fall.t/CONFIG.tagFall; ctx.save(); ctx.translate(0, -(1-k*k)*120); }
      if (tag && tag.ok) ctx.drawImage(tag, x, y, tw, th);
      else { ctx.fillStyle='#d8262a'; ctx.fillRect(x,y,tw,th); ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(L().complaintTag, x+tw/2, y+th/2); }
      if (fall) ctx.restore();
    }
  }
  ctx.fillStyle='#151c26'; ctx.fillRect(0, LANE_Y-36, W, 72);
  if (state.claimSteps > 0){   // 回復までの良品カウント（コンベアの左上）
    ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(`${L().goodStreak} ${state.goodStreak}/${CONFIG.recoverStreak}`, 10, LANE_Y-24);
  }
  ctx.strokeStyle='#f5b700'; ctx.lineWidth=2; ctx.setLineDash([20,14]); ctx.beginPath(); ctx.moveTo(0,LANE_Y+26); ctx.lineTo(W,LANE_Y+26); ctx.stroke(); ctx.setLineDash([]);
  // 下の帯：組み立ての流れ（常に表示）＋ボタン
  ctx.fillStyle='#1b2330'; ctx.fillRect(0, LANE_Y+36, W, H-(LANE_Y+36));
  { const im = flowImg(), fh = CONFIG.flowW/9;
    if (im) ctx.drawImage(im, CONFIG.flowX, CONFIG.flowY, CONFIG.flowW, fh);
    else { // 予備：色の丸を並べる
      const order = ['blue','green','orange','yellow','red','gray'];
      order.forEach((c,i)=>{ const x = CONFIG.flowX+20+i*44, y = CONFIG.flowY+fh/2; ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2); ctx.fillStyle=COLORS[c].hex; ctx.fill(); ctx.save(); ctx.translate(x,y); drawMark(COLORS[c].mark, 6); ctx.restore(); });
    }
  }
  drawButtons();
  for (const s of state.shipping){
    let {x,y,size} = shipPos(s);
    if (s.bad){ x += (Math.random()-.5)*5; y += (Math.random()-.5)*4; }   // 不良車はガタガタ揺れる
    if (!s.bad && s.phase<0.45){   // 良品：光る
      const k = s.phase/0.45, fl = FX.flash, fs = Math.min(260, size*2*(1+k*1.2));
      ctx.save(); ctx.globalAlpha = 0.85*(1-k);
      if (fl && fl.ok) ctx.drawImage(fl, s.x-fs/2, s.y-fs/2, fs, fs); else { ctx.beginPath(); ctx.arc(s.x,s.y,fs/2,0,Math.PI*2); ctx.fillStyle='rgba(255,250,200,.6)'; ctx.fill(); }
      ctx.restore();
    }
    if (s.phase<0.35){ ctx.beginPath(); ctx.arc(x,y,size,0,Math.PI*2); ctx.fillStyle= s.bad ? 'rgba(90,60,60,.85)' : 'rgba(217,70,59,.85)'; ctx.fill(); }
    drawCar(x, y, size, s.rank);
    if (s.phase>0.8 && !s.bad){ ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(L().vroom, x-60, y-34); }
  }
  for (const p of state.parts) drawParticle(p);
  for (const p of state.popups){
    ctx.globalAlpha = Math.max(0, 1-p.t/1.2); ctx.fillStyle=p.color; ctx.font=`bold ${p.size||18}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.text, Math.max(70, Math.min(W-70, p.x)), p.y - p.t*30); ctx.globalAlpha = 1;
  }
  for (const m of state.money){   // 「+N万円」
    if (m.t < 0) continue;
    const k = m.t/CONFIG.moneyTime;
    ctx.globalAlpha = k < 0.5 ? 1 : Math.max(0, (1-k)/0.5); ctx.fillStyle='#ffd84a'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(m.text, Math.max(70, Math.min(W-70, m.x)), moneyY(m, k)); ctx.globalAlpha = 1;
  }
  state.toasts.filter(t => !(t.wait > 0)).slice(0,1).forEach((t) => {   // 大事なお知らせ：1つだけ、決まった場所に
    const k = t.t/t.dur, y = CONFIG.bannerY;
    ctx.globalAlpha = k < 0.85 ? 1 : (1-k)/0.15;
    if (t.level){   // LEVEL UP：黄色い帯（同じ場所・同じ列）
      ctx.fillStyle='rgba(245,183,0,.92)'; ctx.fillRect(0, y-22, W, 44);
      ctx.fillStyle=t.color; ctx.font='bold 28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(t.text, W/2 + (k<0.12 ? (1-k/0.12)*-W : 0), y); ctx.globalAlpha = 1; return;
    }
    ctx.font='bold 16px sans-serif'; const tw = Math.min(W-24, ctx.measureText(t.text).width + 24);
    ctx.fillStyle='rgba(0,0,0,.72)'; ctx.fillRect(W/2-tw/2, y-14, tw, 28);
    ctx.fillStyle=t.color; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t.text, W/2, y, W-30);
    ctx.globalAlpha = 1;
  });
  if (state.hint > 0 && state.hint <= CONFIG.hintShow && state.running){
    ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fillRect(30, 300, W-60, 50);
    ctx.fillStyle='#ffd84a'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(L().hint, W/2, 325, W-70);
  }
  if (state.banner){
    const k = state.banner.t/state.banner.dur;
    ctx.globalAlpha = k<0.8 ? 1 : (1-k)/0.2;
    ctx.fillStyle='rgba(245,183,0,.92)'; ctx.fillRect(0, 230, W, 64);
    ctx.fillStyle='#222'; ctx.font='bold 34px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(`${state.banner.text}  Lv${state.level}`, W/2 + (k<0.15 ? (1-k/0.15)*-W : 0), 262);
    ctx.globalAlpha = 1;
  }
  if (state.rankUp && state.rankUp.t >= 0){
    const ru = state.rankUp, k = ru.t/ru.dur, im = CAR_RANKS[ru.rank] && CAR_RANKS[ru.rank].img;
    ctx.globalAlpha = k<0.1 ? k/0.1 : (k>0.8 ? (1-k)/0.2 : 1);
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0, 372, W, 170);
    const sc = 0.85 + 0.15*Math.min(1, k/0.15);
    if (im && im.ok){ const w=230*sc*(CAR_RANKS[ru.rank].scale||1), h=w*im.height/im.width; ctx.drawImage(im, W/2-w/2, 452-h/2, w, h); }
    ctx.fillStyle='#ffd84a'; ctx.font='bold 21px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(L().rankUp(CAR_NAMES[lang][ru.rank]), W/2, 394);
    ctx.fillStyle='#fff'; ctx.font='bold 17px sans-serif';
    ctx.fillText(L().perCar(fmtYen(CAR_VALUES[ru.rank])), W/2, 522);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (state.flash){ ctx.fillStyle=`rgba(${state.flash.color},${0.6*(1-state.flash.t/state.flash.dur)})`; ctx.fillRect(0,0,W,H); }
  if (state.ending > 0){ ctx.fillStyle=`rgba(0,0,0,${0.5*(1-state.ending/0.9)})`; ctx.fillRect(0,0,W,H); }
}

// ===== 開始・終了・一時停止 =====
let assetsReady = false;
const ov=document.getElementById('overlay'), ovText=document.getElementById('ovText'), startBtn=document.getElementById('startBtn');
const shareBtn=document.getElementById('shareBtn'), copiedEl=document.getElementById('copied'), flowTitle=document.getElementById('flowTitle');
const pauseOv=document.getElementById('pauseOv');
let overlayMode = 'title';
function renderOverlay(){
  const T = L();
  copiedEl.textContent = '';
  if (overlayMode==='title'){
    flowTitle.style.display = '';
    ovText.innerHTML=T.intro; startBtn.textContent = assetsReady ? T.start : T.loading; startBtn.disabled = !assetsReady;
    shareBtn.classList.add('hidden');
  } else {
    flowTitle.style.display = 'none';
    const r=window.lastResult, names=CAR_NAMES[lang];
    const title = TITLES[lang][Math.max(0, r.topRank)];
    let html = `<b style="font-size:22px">${T.over}</b><br>`;
    if (r.newRecord) html += `<span class="newRec">${T.newRec}</span><br>`;
    html += `<div class="title">${T.titleLine(title)}</div>`;
    html += `<div class="res">${T.topCarLine(r.topRank>=0 ? names[r.topRank] : T.none)}<br>`;
    html += `${T.shipped} <b>${r.cars}</b>${T.unitCars}`+(r.claims ? ` / ${T.complaints} ${r.claims}` : '')+`<br>`;
    html += `${T.thisSales} <b>${fmtYen(r.sales)}</b><br>${T.best} ${fmtYen(r.bestSales)}<br>`;
    html += `Lv ${r.level} / ${T.time} ${fmtTime(r.seconds)}</div>`;
    const nx = r.topRank + 1;
    if (nx < CAR_RANKS.length) html += `<div class="goal">${r.topRank>=0 ? T.nextGoal(names[nx]) : T.firstGoal(names[0])}<img src="${SILHOUETTES[nx]}" alt="" onerror="this.onerror=null;this.className='fb';this.src='${CAR_RANKS[nx].src}'"></div>`;
    else html += `<div class="goal">${T.allDone}</div>`;
    ovText.innerHTML = html; startBtn.textContent=T.retry; startBtn.disabled = false;
    shareBtn.textContent = T.share; shareBtn.classList.remove('hidden');
  }
  document.getElementById('langJa').classList.toggle('on', lang==='ja');
  document.getElementById('langEn').classList.toggle('on', lang==='en');
  document.documentElement.lang = lang;
}
function renderPause(){
  document.getElementById('pauseTitle').textContent = L().pause;
  document.getElementById('resumeBtn').textContent = L().resume;
  document.getElementById('muteBtn2').textContent = muted ? L().soundOff : L().soundOn;
}
function pauseGame(){
  if (!state.running || state.paused) return;
  state.paused = true; activePointer = null; state.armed = false; state.queuedDrop = false;
  renderPause(); pauseOv.classList.remove('hidden');
}
function resumeGame(){ if (!state.paused) return; state.paused = false; last = performance.now(); pauseOv.classList.add('hidden'); if (!state.canDrop) state.canDrop = true; }
document.getElementById('resumeBtn').onclick = resumeGame;
document.getElementById('muteBtn2').onclick = ()=>setMuted(!muted);
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) pauseGame(); else resumeAudio(); });
function startGame(){
  setupWorld(); newState(); state.running=true; activePointer=null; ov.classList.add('hidden');
  preloadTiers(1); loadFx();
}
function startEnding(){
  state.running=false; state.ending=0.9; state.shake=16;
  state.flash={ color:'255,40,40', t:0, dur:0.6 };
  sfx('game_over');
  const prevBest = Store.get('bestSales', 0), prevRank = Store.get('bestRank', -1);
  const newRecord = state.sales > prevBest && state.sales > 0;
  if (newRecord) Store.set('bestSales', state.sales);
  if (state.topRank > prevRank) Store.set('bestRank', state.topRank);
  window.lastResult = { cars:state.cars, carsGood:state.carsGood, claims:state.claims, repairs:state.repairs, sales:state.sales, seconds:Math.round(state.elapsed), level:state.level, discards:state.discards,
    topRank:state.topRank, bestSales:Math.max(prevBest, state.sales), bestRank:Math.max(prevRank, state.topRank), newRecord };
}
function showResult(){ overlayMode='result'; renderOverlay(); ov.classList.remove('hidden'); }
startBtn.onclick = ()=>{ if (overlayMode==='title' && !assetsReady) return; startGame(); };
// シェア：プレイヤーがボタンを押したときだけ（端末の共有メニュー、なければ文をコピー）
shareBtn.onclick = ()=>{
  const r = window.lastResult; if (!r) return;
  const text = L().shareText({ cars:r.cars, sales:r.sales, title:TITLES[lang][Math.max(0,r.topRank)] });
  if (navigator.share){ navigator.share({ text }).catch(()=>{}); return; }
  const done = ()=>{ copiedEl.textContent = L().copied; };
  try{ navigator.clipboard.writeText(text).then(done, ()=>{ copiedEl.textContent = text; }); }catch(e){ copiedEl.textContent = text; }
};
function setAssetsReady(){ if (assetsReady) return; assetsReady = true; renderOverlay(); setTimeout(()=>{ loadFx(); preloadTiers(1); }, 0); }
Promise.all(IMG_WAIT).then(setAssetsReady);
setTimeout(setAssetsReady, CONFIG.loadTimeout*1000);
document.getElementById('langJa').onclick = ()=>{ lang='ja'; renderOverlay(); };
document.getElementById('langEn').onclick = ()=>{ lang='en'; renderOverlay(); };
function detectLang(){
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'ja' || q === 'en') return q;
  const sdk = window.CrazyGames && window.CrazyGames.SDK;
  if (sdk){
    try{ const loc = (sdk.user && sdk.user.systemInfo && sdk.user.systemInfo.locale) || ''; return loc.slice(0,2) === 'ja' ? 'ja' : 'en'; }
    catch(e){ return 'en'; }
  }
  return (navigator.language||'').slice(0,2) === 'ja' ? 'ja' : 'en';
}
lang = detectLang();
setupWorld(); newState(); renderOverlay(); renderPause(); requestAnimationFrame(loop);
// テスト用：window.QR でゲーム状態を確認できます
window.QR = { get state(){return state;}, drop, setAim, CONFIG, ITEMS, K, RECIPES, COLORS, recipeResult, makePart, shipCar, levelUp, fmtYen, clampAim, BOX, HOLD_Y,
  get assetsReady(){return assetsReady;}, defectsAllowed, mechanicAllowed, mechanicCount, randPiece, piece, dropLimit, dropLimitAt, defectChance, floorTarget, riseFrac, diffCars, neededParts, mechanicForced, disposalCostOf, timeRiseFrac, claimCap, carsToLevelUp, moneyY, toast, defectAge,
  tierFor, artFor, ART, FX, UI, binLiftFor, pauseGame, resumeGame, setMuted, get muted(){return muted;}, sfx, TITLES, TEXT, gameBodies, startGame, startEnding, flowImg,
  get audioUnlocked(){return audioUnlocked;}, sfxBuf, sfxEl };
</script>
</body>
