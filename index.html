<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quality Rush Ver0.5</title>
<style>
  html,body{margin:0;height:100%;background:#1b2330;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center}
  canvas{background:#2c3a4f;border-radius:8px;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.74);text-align:center;padding:0 14px;overflow-y:auto}
  .ov.hidden{display:none}
  button{font-size:20px;padding:12px 28px;margin:8px;border:none;border-radius:10px;background:#f5b700;color:#222;font-weight:bold}
  #langRow{margin-top:10px}
  #langRow button{font-size:15px;padding:8px 16px;background:#445;color:#fff}
  #langRow button.on{background:#fff;color:#222}
  h1{margin:0 0 6px}
  #ovText{margin:6px 0;font-size:15px;line-height:1.5}
  #startBtn{font-size:26px;padding:14px 44px}
  #howBtn{font-size:16px;padding:8px 20px;background:#445;color:#fff}
  #howBtn.hidden{display:none}
  #howBtn:disabled{opacity:.5}
  #startBtn:disabled{background:#8a7a40;color:#444;opacity:.8}
  #shareBtn{font-size:16px;padding:9px 20px;background:#2f7fe0;color:#fff}
  #shareBtn.hidden{display:none}
  .flowBig{display:block;width:min(400px,96vw);margin:6px auto;border-radius:10px}   /* v5k: 8列・960px の図（以前は min(340px,92vw)） */
  .flowBig.fb{display:none}
  .res{font-size:17px;line-height:1.55}
  .title{font-size:22px;color:#ffd84a;font-weight:bold}
  .newRec{display:inline-block;color:#ffd84a;font-size:28px;font-weight:bold;animation:glow .6s ease-in-out infinite alternate}
  @keyframes glow{from{text-shadow:0 0 4px #ffd84a;transform:scale(1)}to{text-shadow:0 0 18px #fff3a0;transform:scale(1.08)}}
  .goal{margin-top:8px;font-size:15px;color:#cfe}
  .goal img{display:block;margin:6px auto 0;width:160px;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
  .goal img.fb{filter:brightness(0) drop-shadow(0 0 6px rgba(255,255,255,.6))}
  #copied{font-size:14px;color:#9fe;min-height:18px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay" class="ov">
    <h1>Quality Rush</h1>
    <img id="flowTitle" class="flowBig" src="assets/ui/assembly_flow.webp" alt="" onerror="this.className='flowBig fb'">
    <div id="ovText"></div>
    <button id="startBtn" disabled>読み込み中…</button>
    <button id="howBtn" disabled>遊び方</button>
    <script>(function(){ var q = new URLSearchParams(location.search).get('lang'); var l = (q==='ja'||q==='en') ? q : ((navigator.language||'').slice(0,2)==='ja' ? 'ja' : 'en'); if (l==='en'){ document.getElementById('startBtn').textContent='Loading…'; document.getElementById('howBtn').textContent='How to play'; } })();</script>
    <button id="shareBtn" class="hidden"></button>
    <div id="copied"></div>
    <div id="langRow"><button id="langJa">日本語</button><button id="langEn">English</button></div>
  </div>
  <div id="pauseOv" class="ov hidden">
    <h1 id="pauseTitle"></h1>
    <img class="flowBig" src="assets/ui/assembly_flow.webp" alt="" onerror="this.className='flowBig fb'">
    <button id="resumeBtn"></button>
    <button id="muteBtn2" style="font-size:16px;padding:9px 20px;background:#445;color:#fff"></button>
  </div>
</div>
<script src="lib/matter.min.js"></script>
<script>
// ===== 設定（数字はここを変えれば調整できます） =====
const CONFIG = {
  W: 400, H: 760,           // 画面（下の40ピクセルは組み立ての流れバーとボタン）
  overflowGrace: 2.0,       // 危険ラインより上に部品がある状態が何秒続いたらゲームオーバーか
  overflowGraceWindowSec: 60, // ゲーム開始からこの秒数のあいだに始まったあふれだけ、猶予を足す（最初の1分だけやさしく）
  overflowGraceSec: 3,      // その猶予（秒）。overflowGrace に上乗せ（最初の1分は 2+3＝5秒続いたらゲームオーバー）。0で無効
  // --- 難しさ：完成した車の台数＋経過時間（時間の分は毎フレームなめらかに変わる）。レベルは表示と車の種類・絵だけ ---
  dropTimeStart: 6,         // 0台のときの「落とすまでの制限時間」（秒）
  dropTimeFirst: 5.5,       // 1台完成したときの制限時間（秒）
  dropTimeStep: 0.25,       // そこから1台ごとに短くする秒数
  dropTimePerMin: 0.4,      // さらに経過1分ごとに短くする秒数（なめらかに）
  dropTimeMin: 1.5,         // いちばん短い制限時間（秒）
  warnBelow: 1.0,           // 残りこの秒数を切ったら警告音
  dropCooldown: 0.45,       // 落としたあと次を落とせるまでの秒数
  minDropInterval: 0.6,     // 連続して落とすときの最短の間隔（秒）。前に落としてからこの秒数のあいだのタップは無視（ためておかない）
  carsPerLevel: [1, 1],     // レベルアップに必要な車の台数（Lv1, Lv2, …）。表より先のレベルは carsPerLevelRest 台
  carsPerLevelRest: 2,      // v5l：トレーラー（Lv8）までの台数＝carsPerLevel の合計＋carsPerLevelRest×残りのレベル＋1。いまは 1+1+2×5＝12台でLv8 → 13台目がトレーラー。10台目にするなら carsPerLevel:[1,1,1,1,1]（1×5+2×2＝9台でLv8）
  defectFirst: 5,           // 1台完成したときの不良品の確率（%）（0台は0%）
  defectStep: 2,            // そこから1台ごとに増やす%
  defectPerMin: 3,          // さらに経過1分ごとに増やす%（1台目の完成後だけ・なめらかに）
  defectMax: 35,            // 不良品の確率の上限（%）
  noDefectSec: 60,          // 最初のこの秒数は不良品なし（さらに1台目の完成車までも不良品なし）
  floorTimeFrom: 60,        // この秒数から時間で床が上がり始める（floorStartAfterFirstCar が false のときだけ使う）
  floorStartAfterFirstCar: true, // true：時間で床が上がるのは「1台目の車が完成してから」数える（まだ0台なら上がらない）
  floorStartDelaySec: 0,    // 1台目の完成から、時間で床が上がり始めるまでの秒数
  floorStartFallbackSec: 120, // 救済：0より大きいと、1台目の完成か「開始からこの秒数」のどちらか早いほうから上がり始める（0＝使わない）
  floorPerMin: 0.10,        // 1分ごとに床が上がる高さ＝箱の高さ×この割合（なめらかに）
  floorTimeMax: 0.40,       // 時間で上がる分の上限
  diffCountsBadCars: true,  // 難しさの台数に不良車も数えるか
  complaintRise: 0.05,      // クレーム1回で床が上がる高さ＝箱の高さ×この割合
  riseMax: 0.50,            // 床が上がる高さの上限（時間の分＋クレーム分の合計・箱の高さ×この割合）。クレームの数はこの中に収まる数まで
  recoverStreak: 3,         // 良品をこの台数連続で出庫すると、クレーム1回分床が下がる
  floorRiseSpeed: 40,       // 床が動く速さ（ピクセル/秒）
  // --- 何もしないと早く終わる：時間切れが続くと次の制限時間が短くなる ---
  idleSpeedup: 0.3,         // 時間切れ1回ごとに短くする秒数
  idleMinDrop: 1.5,         // そのときのいちばん短い制限時間（秒）。全体の最短 dropTimeMin より短くはならない
  idleReset: 1,             // 自分で落とす（捨てる）とこの回数で元に戻る
  // --- 部品（半径。色と形は COLORS／ITEM_DEFS） ---
  radius: { screw:30, wheel:18, tire:24, suspension:20, frame:30, engine:36, body:44, panel:26, glass:20, hinge:16,   /* v5m：ちょうつがい 18→16 */
            tire_wheel:28, suspension_frame:36, engine_chassis:50, rolling_chassis:62, body_car:74, car:90, mechanic:22 },
  // 落ちてくる部品の割合。v5k：ボディとドア・ボンネット（screw）は落ちてこない（紫の外板・窓ガラス・ちょうつがいから組み立てる）
  dropWeights:     { screw:0, wheel:18, tire:18, suspension:11, frame:11, engine:11, body:0, panel:16, glass:11, hinge:6 },   // v5m：外板 14→16、窓ガラス 9→11、ちょうつがい 12→6（半径 18→16）（仕様 E''）
  // v5m：ちょうつがいを出やすくする（仕様 E''）。部品を1つ出すたびに数え直す。enabled:false で無効
  //   condition：'deficit'＝箱の中の「ボディ付きの車台」(body_car) の数 ＞ 箱の中のドア・ボンネット＋ちょうつがい（不良品はのぞく）の数 のとき（既定）／'any'＝body_car が1つでもあるとき（比較用）
  //   weight：そのあいだの ちょうつがいの割合（ふだんは dropWeights.hinge）
  //   v5o：'nearby'（既定）＝箱の中の良品の body_car（ドアのない車）の数 ＞ どれかの body_car の中心から（その車の半径＋nearPx）以内に中心がある良品のドア・ボンネット＋ちょうつがい（箱の中・まだ付いていない）の数 のとき、ちょうつがいの割合を weight に。URL ?hingeNear=80 で nearPx を上書き
  //        'pity'＝良品の body_car が箱にあって、直近 pityN 個のふつうの部品（不良品・整備士をのぞく、手持ち・次も含む）に ちょうつがいが1つもないとき、次を必ず ちょうつがいにする（割合は変えない）
  //        URL ?hinge=pity|nearby|deficit|any|off で上書き（off＝enabled:false）
  hingeBoost: { enabled: true, weight: 10, condition: 'nearby', nearPx: 80, pityN: 6 },   // v5o 既定：'nearby'（車の半径＋80px）
  // v5n（仕様 F）：タイヤ・タイヤホイールの出る割合を n（＝diffN()：出荷台数＋3×(周−1)）で下げる。各 max(min, start − perCar×(n−1))。n<1 は start
  //   tireDecayPreset：'weak'／'mid'（標準）／'strong'。URL ?tire=weak|mid|strong で上書き。'custom' のときは tireDecay の数字をそのまま使う
  //   不良品（DEFECTABLE から選ぶ）は今までどおり素の dropWeights（タイヤの減りは効かせない）
  tireDecayPreset: 'strong',   // v5o：標準を strong に（?tire=mid で v5n の標準）
  tireDecayPresets: { weak:{ start:18, perCar:0.5, min:12 }, mid:{ start:18, perCar:0.8, min:10 }, strong:{ start:18, perCar:1.2, min:8 } },
  tireDecay: { enabled: true, start: 18, perCar: 0.8, min: 10, parts: ['tire','wheel'] },   // parts：dropWeights の id（wheel＝ホイール、tire＝タイヤ。合体品 tire_wheel は落ちてこない）
  bodyOnDemand: false,      // v5k は false。true にすると前の版と同じく、ローリングシャシー（赤✚）があってボディがどこにもないときだけボディを「次」に出す
  // --- 足りない部品を助ける：箱で相手を待っている部品の相手を出す確率 ---
  helpChanceFirst: 1.0,     // 足りない相手部品を出す確率：1台目の車が完成するまで（完成車0台のとき）
  helpChanceEarly: 0.7,     // 足りない相手部品を出す確率：完成車が helpEarlyCars 台以下のとき（ここを変えるだけで調整できる）
  helpEarlyCars: 2,
  helpChance: 0.50,         // 足りない相手部品を出す確率：それより後
  // --- 良品を捨てたときの廃棄コスト（円・売上から引く。売上はマイナスにもなる。マイナスでもゲームは続く）---
  // 組み立て品は中の部品の合計。不良品と整備士は0円
  disposalMode: 'ratio',    // v5h は 'ratio' で確定（'fixed' は予備・未使用）。 'ratio'＝いま作っている車の売値×割合 ／ 'fixed'＝部品ごとの金額×車の格の倍率
  // ratio：いま完成したら売れる車の値段 × この割合（部品1つごとに1万円単位で四捨五入）。screw はドア・ボンネットの部品
  // v5k：ボディ（外板＋窓ガラス＝20%）とドア・ボンネット（外板＋ちょうつがい＝13%）は中の部品の合計なので、ここには書かない
  disposalRatio: { wheel:0.03, tire:0.03, suspension:0.07, frame:0.12, engine:0.25, panel:0.10, glass:0.10, hinge:0.03, mechanic:0 },
  disposalRound: 10000,     // 何円単位で丸めるか（ratio のとき）
  // fixed：部品ごとの金額（円）× disposalTierMult（車の格：mass＝ふつう Lv1-4／luxury＝高級 Lv5-6／sport＝スポーツ Lv7〜）
  disposalCost: { screw:100000, wheel:200000, tire:200000, suspension:400000, frame:600000, engine:1200000, body:2500000, panel:1250000, glass:1250000, hinge:100000, mechanic:0 },   // 予備（未使用）
  disposalTierMult: { mass:1, luxury:2, sport:3 },
  badCarPays: false,        // 不良車の出庫でも売上が入るか
  badCarCountsForLevel: false, // 不良車をレベルアップの台数に数えるか
  // --- 整備士 ---
  mechanicChance: 0.06,     // 1回の投下ごとに整備士が「次」に出る確率（1台目の完成後、箱に不良品があるときだけ）
  mechanicRound2Pct: 3,     // v5n（仕様 F）：2周目からの整備士の確率（％）。4／3（標準）／2。null＝mechanicChance のまま。URL ?mech=4|3|2 で上書き。必ず出す整備士（20秒）は別
  mechanicForceSec: 20,     // 不良品がこの秒数以上箱にあれば、次は必ず整備士（必ず出したら時計は0に戻る）
  mechanicForceCooldown: 30, // 必ず出す整備士は、前に必ず出した時からこの秒数たつまで出さない（6%の偶然は別）
  mechanicMax: 1,           // 同時に出る最大数
  mechanicCooldownSec: 0,   // v5o：整備士が出たあと（偶然も20秒の必ずも）この秒数は次の整備士を出さない。0＝なし（案は10）。URL ?mechcd=10
  mechanicRepairs: 1,       // 1人が直せる数
  // 整備士は落としたあと自分では動かない（ふつうの丸い部品と同じ）。不良品に触れたら直して消える。直さなければ箱に残る（帰らない）
  mechanicLandedCounts: false, // 箱に着地して残っている整備士を「同時に出る最大数」に数えるか（false＝数えない。数えると残った整備士で次が出なくなる）
  sparkleFrame: 0.08,       // キラキラ1コマの秒数
  // --- 演出 ---
  slowmoScale: 0.35,        // 良品の完成車：スローの速さ（1＝通常）
  slowmoTime: 0.5,          // スローの長さ（実時間の秒）
  countUpTime: 0.8,         // 売上のカウントアップの秒数
  complaintShake: 16,       // クレームの画面の揺れ
  maxParticles: 60,         // 煙・破片・コインなどの最大数（重くならないように）
  smokeInterval: 0.12,      // 不良車の煙を出す間隔（秒）
  smokeGrow: 1.3,           // 煙が広がる大きさ（車の大きさに対して）
  lowFpsMs: 24,             // 1フレームの平均がこれ(ms)を超えたら演出を間引く
  // --- 文字の出し方 ---
  bannerY: 200,             // お知らせの帯の高さ（箱の上のほうに固定）
  bannerTime: 1.2,          // お知らせ1つの表示秒数（重なるときは順番に。LEVEL UP も同じ列で、待ちがあれば先頭に入る）
  levelBannerColor: '#222', // LEVEL UP の文字の色
  bannerQueueMax: 4,        // 待たせるお知らせの最大数
  moneyTime: 0.8,           // 「+N万円」が浮かんで消えるまでの秒数
  moneyTopY: 240,           // 「+N万円」はこの高さで消える（お知らせの帯より下）
  moneyStackY: 28,          // 同時に出たときに下へずらす量（ピクセル）
  moneyStackDelay: 0.15,    // 同時に出たときに遅らせる秒数
  tagFall: 0.3,             // クレーム札が床に落ちるまでの秒数
  seqGap: 0.2,              // お金→札→お知らせ の間隔（秒）
  // --- Lv2の不良品ヒント ---
  hintShow: 3.5, hintDelayRankUp: 2.4, hintDelay: 1.0,
  // --- 画面上部の配置 ---
  nextX: 370, nextY: 70, nextMaxR: 18, gaugeRightPad: 84,
  binX: 14, binY: 178, binScale: 0.65,
  binTouchMargin: 4,        // 指が箱の左右の壁からこの距離以内（または外）なら、離すとゴミ箱へ（動くごみ箱のときは箱の中心からの同じ距離）
  // --- 動くごみ箱（ラウンド2用・左右に動く）---
  // enabled：'off'＝動かない／'always'＝いつも動く／'round2'＝state.round が2以上のときだけ動く（ラウンド1は止まったまま）
  // speedPxPerSec：平均の速さ（1往復＝2×rangePx を この速さで → 周期 = 2*rangePx/speedPxPerSec 秒）
  // rangePx：もとの位置から真ん中へ向かって動く最大の距離。pattern：'sine'（なめらかに折り返す）
  // hitOuterPx：動いているとき、ごみ箱の中心から外側（壁側）へどこまでをごみ箱に入れる範囲にするか（内側は止まっているときと同じ）
  // rightPhase：右の箱の位相のずれ（0＝左右対称に同時に真ん中へ、0.5＝交互）
  // v5l：動いているときの当たり判定は「描いたごみ箱」（中心から 22×binScale）＋ hitPadPx。壁とごみ箱のあいだは ふつうに落とす場所（仕様 B-3・E-5）。
  //   v5m：hitOuterPx＝外側（壁側）の当たり範囲（ごみ箱の中心から px）。そのまま使う（v5l は min(hitOuterPx, 内側) で内側の値に切られていた）。null なら内側と同じ。ごみ箱が壁に近く、外側のはしが箱の壁より外なら、そこから外はぜんぶごみ箱
  binMove: { enabled: 'round2', speedPxPerSec: 40, rangePx: 100, pattern: 'sine', hitOuterPx: 18, hitPadPx: 4, rightPhase: 0,
    gapGuard: true, gapLatchPx: 8 },   // v5o：壁とごみ箱のあいだ（すきま）に狙いを置いたら、ごみ箱がそこへ動いてきても捨てない（指を gapLatchPx より動かしたら判定し直す）
  // --- 2周目以降（v5k・docs/round2_parts_spec.md B）---
  // トレーラー（いちばん上の車）を良品で出庫すると次の周へ：車は軽トラから、売上・レベルの数字・出庫台数・箱の中の部品はそのまま、
  // 床は roundFloorReset（v5l：'all'＝全部0から。'claims'＝v5k までのクレーム分だけ）。トレーラーを出すたびに繰り返す
  // 難しさの基準（v5k）。'time'＝いままでどおり（台数＋経過時間）。'shipped'＝出庫した台数だけで決める
  // shipped の数字は「仮」（ぷらんさんの数字が来たら入れかえる）。値＝base + perCar ×（出庫台数 − startAfter）、cap は上限（dropTime は下限）。null／Infinity＝なし
  // どちらの基準でも、周の上限・下限（rounds の defectMax／dropTimeMin／floorTimeMax）を上からかける
  difficulty: {
    basis: 'shipped',   // 'shipped'（仕様D章・ふつう）／'time'（v5jまでの決め方：台数＋経過分、周ごとの上限は rounds の表）
    // 仕様D章：n＝出荷台数（countBad:true なら不良車も数える）＋周の足し分（rounds の diffAdd：2周目＋3、3周目＋6、以降＋3ずつ）
    //   値＝first + perCar×(n−1) + perMin×経過分（1台目完成からの分）。n＝0 のときは zero（6秒・不良0%・床0。最初の60秒は不良なし＝noDefectSec）
    //   min／max は下限／上限（null／Infinity＝なし）。係数の調整：perCar 0.20／2.0／0.02 → 下げるなら 0.15／1.5／0.015、上げるなら 0.25／2.5／0.025
    shipped: {
      countBad: true,

function fmtYen(v){
  if (v < 0) return '−' + fmtYen(-v);   // マイナスは先頭に「−」
  if (lang!=='ja') return `¥${v.toLocaleString()}`;
  if (v >= 100000000){
    const oku = Math.floor(v/100000000), man = (v - oku*100000000)/10000;
    return man > 0 ? `${oku}億${man.toLocaleString()}万円` : `${oku}億円`;
  }
  return v>=10000 ? `${(v/10000).toLocaleString()}万円` : `${v.toLocaleString()}円`;
}

// 見た説明は1つずつ覚える（qr_tutorial_seen = 見たキーの一覧）。まだ見ていない説明は次のゲームでも出る
// 前の版の qr_tutorial_done が true なら、ぜんぶ見たことにする
const TUT_STEPS = ['tut_move','tut_merge','tut_car','tut_bad','tut_scrap','tut_mechanic'];
function tutLoadSeen(){
  const o = {}; if (Store.get('tutorial_done', false) === true){ TUT_STEPS.forEach(k=>o[k]=true); return o; }
  const a = Store.get('tutorial_seen', []); if (Array.isArray(a)) a.forEach(k=>{ if (TUT_STEPS.includes(k)) o[k]=true; });
  return o;
}
let tutSeenStore = tutLoadSeen(), tutForceNext = false;
const tutAllSeen = () => TUT_STEPS.every(k=>tutSeenStore[k]);
let tutDone = tutAllSeen();
function tutSaveSeen(key){   // 1つの説明を「見た」と保存する
  if (!TUT_STEPS.includes(key) || tutSeenStore[key]) return;
  tutSeenStore[key] = true; Store.set('tutorial_seen', TUT_STEPS.filter(k=>tutSeenStore[k]));
  if (tutAllSeen()){ tutDone = true; Store.set('tutorial_done', true); }
}
function tutSaveAll(){ TUT_STEPS.forEach(tutSaveSeen); }   // 「説明をとばす」：ぜんぶ見たことにする
const tutWanted = () => CONFIG.tutorialMode === 'always' || (CONFIG.tutorialMode !== 'off' && (!tutDone || tutForceNext));
// replay（遊び方・always）は全部出す。ふつうはまだ見ていない説明だけ出す
function tutNew(on, replay){
  const prev = on && !replay ? Object.assign({}, tutSeenStore) : {};
  return { on, replay:!!(on && replay), seen:Object.assign({}, prev), prev, log:[], cur:null, curT:0, queue:[], bad:null, merged:false, drops:0 };
}
function tutMark(t, key){ t.seen[key] = true; t.log.push({ key, t: +state.elapsed.toFixed(2) }); }
function tutFlash(key, sec){ const t = state.tut; if (!t.on) return; t.queue.push({ key, t:0, dur:sec }); }
function tutStep(key, sec){   // 3・5・6：最初の1回だけ短く出す
  const t = state.tut; if (!t.on || t.seen[key]) return; tutMark(t, key); tutFlash(key, sec);
}
function tutSkip(){ const t = state.tut; if (!t.on) return; t.on = false; t.bad = null; t.cur = null; t.queue = []; tutSaveAll(); }
// 投下までの時間を止めるか（1 のあいだ・4 のあいだ。どちらも上限あり）
const tutFreeze = () => { const t = state.tut; return !!(t.on && ((t.cur === 'tut_move' && t.curT < CONFIG.tutMoveMaxSec) || (t.bad && t.bad.t < CONFIG.tutBadMaxSec))); };
const tutSlow = () => { const t = state.tut; return t.on && t.bad && t.bad.t < CONFIG.tutBadMaxSec ? CONFIG.tutSlowScale : 1; };
function tutUpdate(rdt){
  const t = state.tut; if (!t.on || !state.running) return;
  if (!t.seen.tut_move){ tutMark(t, 'tut_move'); t.cur = 'tut_move'; t.curT = 0; tutSaveSeen('tut_move'); }
  const held = state.canDrop && state.current;
  // 2：2つ目の部品を持ったら（まだ合体していなければ）
  if (held && t.drops >= 1 && !t.seen.tut_merge && !t.merged){ tutMark(t, 'tut_merge'); t.cur = 'tut_merge'; t.curT = 0; }
  if (t.cur === 'tut_merge' && t.curT >= CONFIG.tutMergeMaxSec){ t.cur = null; tutSaveSeen('tut_merge'); }   // 2：時間切れでも見たことにする
  // 4：最初の×の部品を持ったとき
  if (held && state.current.bad && !t.seen.tut_bad){ tutMark(t, 'tut_bad'); t.bad = { p: state.current, t:0 }; tutSaveSeen('tut_bad'); }
  // 6：最初の整備士を持ったとき
  if (held && state.current.k === K.mechanic) tutStep('tut_mechanic', CONFIG.tutMsgSec);
  t.curT += rdt;
  if (t.bad) t.bad.t += rdt;
  else if (t.queue.length){ tutSaveSeen(t.queue[0].key); t.queue[0].t += rdt;   // 3・5・6：帯に出たときに保存
    if (t.queue[0].t >= t.queue[0].dur) t.queue.shift(); }
}
function tutOnDrop(p, auto){

}

}

// 次の周：車は軽トラから（レベルの数字・売上・出庫台数・箱の中はそのまま）。クレームで上がった床だけ戻す

// v5l：ページのタイトルに版と周（ゲーム中だけ「 - Round N」）
const TITLE_BASE = 'Quality Rush Ver0.5';   // v5n：Ver0.4→0.5
function updateTitle(){

// v5l：ドアの吸い寄せ（CONFIG.doorMagnet・仕様 E'）。物理の1ステップごとに呼ぶ
function doorMagnetStep(){
  const mg = CONFIG.doorMagnet;
  if (!mg || !mg.enabled || !state.running){ if (state.magnet.size) state.magnet.clear(); return; }
  const doors = [], cars = [];
  for (const b of Composite.allBodies(world)){
    if (b.k === K.screw && !merging.has(b.id)) doors.push(b);
    else if (b.k === K.body_car && !merging.has(b.id)) cars.push(b);
  }
  if (!doors.length || !cars.length){ if (state.magnet.size) state.magnet.clear(); return; }
  const seen = new Set();
  for (const d of doors){
    if (d.position.y < DANGER_Y) continue;   // あふれ線より上では引かない
    let best = null, bestGap = Infinity;
    for (const c of cars){
      if (c.position.y < DANGER_Y) continue;
      const gap = Math.hypot(c.position.x-d.position.x, c.position.y-d.position.y) - d.circleRadius - c.circleRadius;
      if (gap <= mg.gapPx && gap < bestGap){ best = c; bestGap = gap; }
    }
    if (!best) continue;
    const key = d.id + ':' + best.id; seen.add(key);
    let rec = state.magnet.get(key);
    if (!rec){ rec = { t0:state.elapsed, done:false, door:d.id, car:best.id }; state.magnet.set(key, rec); state.magnetPulls++; }
    if (rec.done){   // v5o：付かずに終わった → retrySec 秒たってまだ近ければ、もう一度
      if (!(mg.retrySec > 0) || state.elapsed - rec.doneAt < mg.retrySec) continue;
      rec.t0 = state.elapsed; rec.done = false; rec.tries = (rec.tries||1) + 1; state.magnetRetries = (state.magnetRetries||0) + 1;
    }
    if (state.elapsed - rec.t0 > mg.maxSec){ rec.done = true; rec.doneAt = state.elapsed; state.magnetGiveUp++; continue; }   // maxSec たっても付かない：やめる
    const dx = best.position.x - d.position.x, dy = best.position.y - d.position.y, len = Math.hypot(dx, dy) || 1, f = d.mass*mg.forceMul;
    Matter.Body.applyForce(d, d.position, { x:f*dx/len, y:f*dy/len });
  }
  for (const k of [...state.magnet.keys()]) if (!seen.has(k)) state.magnet.delete(k);   // 離れたら、次に近づいたときにやり直し
}
function levelUp(){
  const oldRank = rankForLevel(state.level), oldTier = tierIndexFor(state.level);
  state.level++; state.carsThisLevel = 0;
  const nr = rankForLevel(state.level);
  if (nr > oldRank) state.rankUp = { rank:nr, t:-0.9, dur:1.5 };
  toast(`${L().levelUp}  Lv${state.level}`, CONFIG.levelBannerColor, 0, 0, { level:true, front:true });
  state.flash = { color:'255,255,255', t:0, dur:0.25 };
  sfx('level_up');
  preloadTiers(state.level);
  const nt = tierIndexFor(state.level);
  if (nt > oldTier){ const n = CONFIG.artTiers[nt].name; if (n==='luxury') toast(L().tierLuxury, '#ffd84a', 2.6); if (n==='sport') toast(L().tierSport, '#ffd84a', 2.6); }
  if (state.level === 2) state.defectPending = true;  // Lv2：最初の不良品をヒントつきで出す（不良品が出せる状態になってから）
}
// お知らせ：1つずつ順番に（重ねない）。wait 秒たってから並ぶ
function toast(text, color, dur, wait, opt = {}){
  const t = { text, color, t:0, dur: CONFIG.bannerTime, wait: wait||0, level: !!opt.level, streak: !!opt.streak, keep: !!opt.keep };   // v5m：keep＝あふれても捨てない
  if (opt.bad) state.toasts = state.toasts.filter(o => !o.streak);   // 不良車のときは古い「3台連続で良品！」を捨てる
  if (opt.front){   // 待ちがあれば先頭へ（いま出ているものは最後まで出す）
    const showing = state.toasts.findIndex(o => !(o.wait > 0) && o.t > 0);
    let i = showing >= 0 ? showing+1 : 0; while (state.toasts[i] && state.toasts[i].level) i++;   // LEVEL UP 同士は順番どおり
    state.toasts.splice(i, 0, t);
  } else state.toasts.push(t);
  if (state.toasts.length > CONFIG.bannerQueueMax + 1){   // v5m：あふれたら、新しいものの1つ前から さかのぼって keep でない待ちを1つ捨てる（keep は捨てない）
    const head = state.toasts.findIndex(o => !(o.wait > 0) && o.t > 0);
    let i = state.toasts.length - 2; while (i >= 0 && (state.toasts[i].keep || i === head)) i--;
    if (i >= 0) state.toasts.splice(i, 1);
    else if (!t.keep) state.toasts.splice(state.toasts.indexOf(t), 1);   // 全部 keep なら新しいほうを捨てる（keep 同士はあふれてもよい）
  }
}

// ===== 操作 =====
let activePointer = null;
function toGame(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) * CONFIG.W / r.width, y:(e.clientY - r.top) * CONFIG.H / r.height }; }
const toGameX = clientX => { const r = cv.getBoundingClientRect(); return (clientX - r.left) * CONFIG.W / r.width; };
// ===== ごみ箱の位置（動くごみ箱）=====
function binsMoving(){
  const bm = CONFIG.binMove, en = bm && bm.enabled;
  return en === 'always' || (en === 'round2' && (state.round||1) >= 2);
}
// もとの位置から真ん中へ動いた距離（0〜rangePx）。side：-1＝左、1＝右
function binOffset(side){
  if (!binsMoving()) return 0;
  const bm = CONFIG.binMove, range = Math.max(0, roundVal('binRange')||0), sp = Math.max(1e-6, roundVal('binSpeed')||0);   // 周ごと（1周目は binMove のまま）
  if (!range) return 0;
  const period = 2*range/sp, ph = state.binT/period + (side > 0 ? (bm.rightPhase||0) : 0);
  if (bm.pattern === 'triangle'){ const f = ph - Math.floor(ph); return range*(f < 0.5 ? 2*f : 2-2*f); }
  return range*(1 - Math.cos(2*Math.PI*ph))/2;   // sine：もとの位置からなめらかに出て戻る
}
const binX = side => side < 0 ? CONFIG.binX + binOffset(-1) : CONFIG.W - CONFIG.binX - binOffset(1);
// 指の x がどちらのごみ箱に入るか（-1／1／0）。止まっているときは前と同じ（壁から binTouchMargin 以内か外）
function binSideAt(rawX){
  const lx = binX(-1), rx = binX(1);
  if (!binsMoving()){   // 止まっているとき（1周目）：v5k と同じ（壁から binTouchMargin 以内か外）
    const m = CONFIG.binTouchMargin, inL = BOX.left + m - CONFIG.binX, inR = CONFIG.W - CONFIG.binX - (BOX.right - m);
    if (rawX < lx + inL) return -1;
    if (rawX > rx - inR) return 1;
    return 0;
  }
  // v5l：動いているとき：描いたごみ箱の丸（中心から 22×binScale）＋ hitPadPx の中だけ。壁とごみ箱のあいだはふつうに落とす
  const z = binHitZones();
  if (rawX >= z.left[0] && rawX <= z.left[1]) return -1;
  if (rawX >= z.right[0] && rawX <= z.right[1]) return 1;
  return 0;
}
// v5o：すきま（壁とごみ箱のあいだ）に置いた狙いは、ごみ箱が動いてきてもふつうに落とす（仕様 B-3）。指を gapLatchPx より動かすと判定し直す
function binSideFor(rawX){
  const s = binSideAt(rawX), bm = CONFIG.binMove || {};
  if (!binsMoving() || !bm.gapGuard){ state.gapLatch = null; return s; }
  const L = state.gapLatch, lim = bm.gapLatchPx != null ? bm.gapLatchPx : 8;
  if (L && Math.abs(rawX - L.x) <= lim){   // すきまに置いた指がほぼ止まっている：ごみ箱が来ても（通りすぎて戻ってきても）捨てない
    if (s !== 0 && !L.hit){ state.gapGuarded = (state.gapGuarded||0) + 1; L.hit = true; }
    return 0;
  }
  state.gapLatch = null;
  if (s !== 0) return s;   // 指をごみ箱の上へ動かした：捨てる（当たり範囲は v5m のまま）
  const side = rawX < binX(-1) ? -1 : (rawX > binX(1) ? 1 : 0);   // ごみ箱より壁がわ＝すきま
  if (side) state.gapLatch = { side, x:rawX };
  return 0;
}
const BIN_DRAW_R = 22;   // drawBin の丸の半径（binScale をかける前）
function binHitZones(){   // 動くごみ箱の当たり範囲 [左端, 右端]。外側のはしが箱の壁に届くなら、そこから外は全部
  const bm = CONFIG.binMove || {}, r = BIN_DRAW_R*CONFIG.binScale, pad = bm.hitPadPx != null ? bm.hitPadPx : CONFIG.binTouchMargin;
  const inner = r + pad, outer = bm.hitOuterPx != null ? bm.hitOuterPx : inner;   // v5m：設定した外側の値をそのまま使う（v5l の Math.min(…, inner) をやめた）
  const lx = binX(-1), rx = binX(1);
  const lo = lx - outer <= BOX.left ? -Infinity : lx - outer, hi = rx + outer >= BOX.right ? Infinity : rx + outer;
  return { left:[lo, lx + inner], right:[rx - inner, hi], r, inner, outer };
}
function setAim(rawX){
  const r = R(state.current.k);
  state.rawX = rawX;
  state.bin = binSideFor(rawX);
  state.aimX = clampAim(rawX, r);
}
const clampAim = (x, r) => Math.max(BOX.left+r, Math.min(BOX.right-r, x));
function hitButton(g){
  const d = (x,y) => Math.hypot(g.x-x, g.y-y) <= CONFIG.btnR + 6;
  if (d(CONFIG.pauseX, CONFIG.btnY)) return 'pause';
  if (d(CONFIG.muteX, CONFIG.btnY)) return 'mute';
  return null;
}
cv.addEventListener('pointerdown', e=>{
  if (!state.running || state.paused || !e.isPrimary || activePointer!==null) return;
  const btn = hitButton(toGame(e));
  if (btn === 'pause'){ pauseGame(); return; }
  if (btn === 'mute'){ setMuted(!muted); return; }
  if (hitTutSkip(toGame(e))){ tutSkip(); return; }

});
cv.addEventListener('pointermove', e=>{

function release(e){
  if (e.pointerId!==activePointer) return;

    if (state.canDrop) drop();
    else state.ignoredDrops++;   // 前の投下から minDropInterval 秒たっていないタップは無視（ためない）
  }

}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', e=>{ if (e.pointerId===activePointer){ activePointer=null; state.armed=false; state.queuedDrop=false; } });

const dropIntervalOk = () => state.dropClock - state.lastDropAt >= CONFIG.minDropInterval - 1e-6;
function drop(auto){
  if (!state.canDrop || !state.running) return;
  if (!auto && !dropIntervalOk()){ state.ignoredDrops++; return; }   // 連続投下の最短間隔（自動投下は制限時間≧1.5秒なので影響なし）
  state.lastDropAt = state.dropClock;
  state.armed = false; state.queuedDrop = false;
  const p = state.current;
  if (auto){
    const r = R(p.k), x = BOX.left + r + Math.random()*(BOX.right - BOX.left - 2*r);
    makePart(p.k, x, HOLD_Y, { bad:p.bad, auto:true });
    state.idleCount++; state.manualSinceIdle = 0;     // 時間切れが続くほど次の制限時間が短くなる
  } else {
    if (binsMoving()) state.bin = binSideFor(state.rawX);   // 動くごみ箱：離した瞬間の箱の位置で判定（v5o：すきまの狙いは捨てない）
    if (state.bin !== 0) discard(p); else { makePart(p.k, state.aimX, HOLD_Y, { bad:p.bad }); sfx('drop'); }

  }

}
function discard(p){
  state.discards++;

  let text = L().okDiscard, good = p.bad || p.k===K.mechanic;
  if (!good){

  state.effects.push({x: Math.max(40, Math.min(W-40, x)), y: HOLD_Y+16, r:18, t:0, grow:1.5});

}

// ===== 効果音 =====
const SFX_NAMES = ['drop','merge','merge_big','complete','coin','defect_putter','discard','complaint','floor_rise','warning','mechanic_in','repair','level_up','game_over','round_start'];
const SFX_SOFT = ['drop','merge'];
let actx, audioUnlocked = false, sfxLoading = false, muted = !!Store.get('muted', false);
const sfxBuf = {}, sfxEl = {};
function resumeAudio(){   // 最初に画面に触れたときだけ音を使えるようにする（それまでは鳴らさない）
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state !== 'running') actx.resume();
  }catch(e){}
  audioUnlocked = true; loadSfx();
}
['pointerdown','touchend','click','keydown'].forEach(ev => window.addEventListener(ev, resumeAudio, {passive:true}));
function loadSfx(){
  if (sfxLoading) return; sfxLoading = true;
  let ext = 'mp3'; try{ if (document.createElement('audio').canPlayType('audio/ogg; codecs="vorbis"')) ext = 'ogg'; }catch(e){}
  SFX_NAMES.forEach(n => {
    const src = `assets/sfx/${n}.${ext}`;
    const fallback = () => { try{ const el = new Audio(src); el.preload = 'auto'; sfxEl[n] = el; }catch(e){} };
    if (!actx || !window.fetch || location.protocol === 'file:') { fallback(); return; }
    fetch(src).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(b => new Promise((res, rej) => actx.decodeAudioData(b, res, rej)))
      .then(buf => { sfxBuf[n] = buf; }).catch(fallback);
  });
}
function sfx(name){
  if (muted || !audioUnlocked) return;
  const vol = SFX_SOFT.includes(name) ? CONFIG.sfxVolumeSoft : CONFIG.sfxVolume;
  try{
    if (sfxBuf[name] && actx && actx.state === 'running'){
      const s = actx.createBufferSource(), g = actx.createGain(); g.gain.value = vol;
      s.buffer = sfxBuf[name]; s.connect(g).connect(actx.destination); s.start(); return;
    }
    if (sfxEl[name]){ const el = sfxEl[name].cloneNode(); el.volume = vol; const pr = el.play(); if (pr) pr.catch(()=>{}); }
  }catch(e){}
}
function beep(freq, dur){   // 制限時間の残りわずかの「ピッ」
  if (muted || !audioUnlocked) return;
  try{
    if (!actx || actx.state !== 'running') return;
    const o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=freq; o.type='triangle';
    g.gain.setValueAtTime(0.12, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function setMuted(v){ muted = !!v; Store.set('muted', muted); renderPause(); }

// ===== ループ =====
const PHYS_STEP = 1000/60, PHYS_MAX_STEPS = 5;
let last = performance.now(), physAcc = 0;
let frameAvg = 16.7;
function loop(now){
  const rdt = Math.min(0.05, (now-last)/1000); last = now;
  frameAvg = frameAvg*0.9 + rdt*1000*0.1;   // 重いときは煙などを間引く
  if (state.paused){ draw(now); requestAnimationFrame(loop); return; }
  if (state.slowmo > 0) state.slowmo -= rdt;
  const dt = (state.slowmo > 0 ? rdt*CONFIG.slowmoScale : rdt) * (state.running ? tutSlow() : 1);   // 良品の完成車の瞬間だけスロー（説明4のあいだもスロー）
  if (state.running) tutUpdate(rdt);
  if (state.running){
    physAcc += dt*1000; let n = 0;
    while (physAcc >= PHYS_STEP && n < PHYS_MAX_STEPS){ stepFloor(); doorMagnetStep(); Engine.update(engine, PHYS_STEP); physAcc -= PHYS_STEP; n++; }
    if (n === PHYS_MAX_STEPS) physAcc = 0;
    state.elapsed += dt;
